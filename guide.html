- لم يبدأ الإطلاق التجريبي بعد: 0$ - 100,000$
- إطلاق تجريبي مع عدد محدود من المستخدمين التجريبيين: 150,000$ - 300,000$
- قاعدة مستخدمين تجريبيين تنمو بسرعة أو طلبات مسبقة (Waitlist) قوية: 350,000$ - 500,000$


🟡 ثانياً: طريقة التكلفة المستبدلة المعدلة بالمخاطر (Risk Factor Summing)
هذه الطريقة تحسب التقييم بناءً على "كم تكلفنا إعادة بناء هذا المشروع من الصفر؟" مضافاً إليها نسبة تعكس حجم المخاطر المحيطة بالشركة.

🔹 تكلفة إعادة بناء التقنية (Rebuild Cost):
كيف تحسبها؟ احسب إجمالي ساعات العمل التي استغرقها (أو سيستغرقها) الفريق لبناء المنتج البرمجي، واضربها في متوسط أجر المطور أو وكالة التطوير بالساعة.
مثال عملي: إذا احتاج المشروع إلى 3 مطورين لمدة 6 أشهر (حوالي 3,000 ساعة عمل)، وكان معدل تكلفة الساعة 100 دولار، تكون التكلفة:
3,000 × 100 = 300,000 دولار

🔹 علاوة المخاطرة (Risk Premium %):
كيف تحددها؟ هي نسبة مئوية تزيد كلما زادت المخاطر (مخاطر المنافسة، التنظيم القانوني، صعوبة التسويق، أو المخاطر التقنية).
التقدير النموذجي:
- مخاطر منخفضة جداً (فريق خبير وسوق سهل): 10% - 20%
- مخاطر متوسطة (سوق تنافسي وتحت التطوير): 25% - 40%
- مخاطر عالية جداً (تقنية معقدة جداً أو تنظيم حكومي معقد): 50% فما فوق

معادلة الحساب النهائية لهذا البند:
التكلفة المعرضة للمخاطر = تكلفة الإعادة × (1 + نسبة المخاطر / 100)
بناءً على المثال السابق (300,000$ تكلفة و 25% مخاطر):
300,000 × 1.25 = 375,000 دولار


🟡 ثالثاً: النتيجة النهائية (التقييم المدمج)
بعد حساب إجمالي طريقة بيركوس (مثلاً طلع معنا 1,500,000$) وإجمالي التكلفة المستبدلة بالمخاطر (مثلاً 375,000$)، تقوم الحاسبة بأخذ المتوسط ليكون هو التقييم التقريبي العادل للجولة التأسيسية:
التقييم النهائي = (1,500,000 + 375,000) / 2 = 937,500 دولار


3. شرح المدخلات – مرحلة ما بعد الإيرادات
في هذه المرحلة، يتم استخدام مضاعف الإيراد المتكرر (ARR Multiple) وطريقة رأس المال الجريء (VC Method).

🟢 الإيرادات والنمو:
- الإيراد السنوي المتكرر (ARR): إجمالي الإيرادات السنوية من الاشتراكات والعقود.
- معدل النمو السنوي (%): نسبة نمو الإيرادات سنة بعد سنة.
- هامش الربح الإجمالي (%): (الإيرادات - تكلفة الخدمة) / الإيرادات. البرمجيات القوية تتجاوز 70%.
- هامش الربح التشغيلي (%): يستخدم لحساب قاعدة الـ 40. قد يكون سالباً للشركات الناشئة.
- معدل التسرب الشهري (%): نسبة العملاء الذين يلغون اشتراكاتهم شهرياً. أقل من 2% صحي.
- صافي الاحتفاظ بالإيرادات NRR (%): نسبة الإيرادات المحتفظ بها من العملاء الحاليين. فوق 110% يعني توسعاً.

🟢 اقتصاديات الوحدة:
- عدد العملاء الحاليين، تكلفة اكتساب العميل (CAC)، القيمة الدائمة للعميل (LTV).
- صافي الحرق الشهري، النقد المتاح.

🟢 مؤشرات متقدمة (اختيارية):
- ARR الربع الحالي والربع السابق، مصاريف مبيعات وتسويق (لحساب الرقم السحري Magic Number).

🟢 طريقة رأس المال الجريء (VC):
- قيمة التخارج المتوقعة، مضاعف العائد المستهدف (ROI)، سنوات التخارج.


4. اضغط على زر "احسب نطاق التقييم"
بعد إدخال البيانات، اضغط الزر الكبير. ستظهر النتائج كاملة أسفل الزر.

5. كيف تقرأ النتائج؟
🟩 بطاقات مؤشرات الأداء: الإيراد المتكرر، معدل النمو، صافي الاحتفاظ، LTV/CAC، استرداد الاكتساب، الرقم السحري، مضاعف الحرق، المدرج النقدي.
🎯 قاعدة الـ 40: تظهر ما إذا كان مجموع النمو والهامش التشغيلي يتجاوز 40%.
📊 نطاق التقييم: جدول يوضح القيمة المنخفضة والأساسية والمرتفعة حسب طريقتي المضاعف وVC.
📈 رسم بياني: يقارن نطاق التقييم بين الطريقتين بصرياً.
📝 تفسير النتائج: تحليل مفصل لكل مؤشر مع توصيات.

6. تصدير التقارير
📄 تقرير Word كامل + رسم بياني: ملف منسق يحتوي على الغلاف، المؤشرات، نطاق التقييم، الرسم البياني، والتوصيات.
📊 تصدير Excel احترافي: 5 أوراق (غلاف، مدخلات، مؤشرات، نطاق التقييم، تفسير وتوصيات) مع تنسيق احترافي كامل.


💡 نصائح مهمة
- للجولات التأسيسية (ما قبل الإيرادات)، استخدم طريقة بيركوس والتكلفة المستبدلة. القيم النموذجية للشركات الناشئة الواعدة تتراوح بين 500,000$ و 2,500,000$.
- عند استخدام طريقة بيركوس، كن واقعياً في تقدير كل عنصر. المبالغة في التقييم قد تؤثر على مصداقيتك أمام المستثمرين.
- قاعدة الـ 40 هي مؤشر سريع: اجمع نسبة النمو مع هامش الربح التشغيلي. إذا تجاوزت 40% فأنت في وضع صحي.
- الرقم السحري (Magic Number) يقيس كفاءة الإنفاق التسويقي: الرقم أعلى من 1 يعني أن كل دولار تنفقه على التسويق يعود عليك بدولار من الإيرادات الجديدة.
- نسبة LTV/CAC الأعلى من 3x تعني أن نموذج عملك مستدام.
- استخدم نطاق التقييم (منخفض/أساسي/مرتفع) في المفاوضات مع المستثمرين بدلاً من رقم واحد.
- في مرحلة ما قبل الإيرادات، ركز على بناء فريق قوي ومنتج أولي (MVP) وعلاقات استراتيجية قبل البحث عن تمويل.
- الأداة تدعم 6 عملات مختلفة (دولار، يورو، ليرة تركية، جنيه مصري، دينار كويتي، ريال سعودي).
- الآلة الحاسبة العائمة (أسفل يسار الشاشة) متاحة دائماً لإجراء عمليات حسابية سريعة.

        }
    ];

    const container = document.getElementById('toolsContainer');
    const searchInput = document.getElementById('searchInput');
    const noResults = document.getElementById('noResults');

    function renderTools(filter = '') {
        const filtered = tools.filter(tool => tool.name.includes(filter) || filter === '');
        container.innerHTML = '';
        if (filtered.length === 0) {
            noResults.style.display = 'block';
        } else {
            noResults.style.display = 'none';
            filtered.forEach(tool => {
                const card = document.createElement('div');
                card.className = 'tool-card';
                card.innerHTML = `<h2><i class="fas ${tool.icon}"></i> ${tool.name}</h2><div class="tool-content">${tool.content}</div>`;
                container.appendChild(card);
            });
        }
    }

    searchInput.addEventListener('input', e => renderTools(e.target.value.trim()));
    renderTools();
</script>
