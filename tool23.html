<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes">
    <title>حاسبة CAC و CLV | FAROUK GRUP</title>
    <!-- حماية الصفحة  -->
    <script src="auth-check.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        /* الهوية الموحدة للمنصة */
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg-dark: #0b0e17;
            --bg-panel: rgba(18,24,36,0.85);
            --bg-card: rgba(22,30,46,0.8);
            --border-light: rgba(180,133,84,0.25);
            --accent-glow: #b48554;
            --accent-soft: #cfa776;
            --text-light: #f0f4fa;
            --text-muted: #aab7d4;
            --text-dark: #0b0e17;
            --shadow-soft: 0 15px 35px -10px rgba(0,0,0,0.6), 0 0 0 1px rgba(180,133,84,0.15);
            --shadow-glow: 0 15px 35px -10px rgba(0,0,0,0.8), 0 0 20px rgba(180,133,84,0.3);
            --radius-md: 20px;
            --radius-lg: 30px;
            --transition: all 0.3s ease;
            --gold: #b8860b;
            --gold-light: #d4b15a;
            --gold-soft: rgba(184,134,11,0.1);
            --dark: #0f0f0f;
            --dark-light: #1a1a1a;
            --white: #ffffff;
            --offwhite: #f9f9f9;
            --text: #333;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: radial-gradient(circle at 70% 30%, #141c2b, #0a0e16);
            color: var(--text-light);
            line-height: 1.6;
            min-height: 100vh;
            position: relative;
        }
        .glow-bg { position: fixed; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 0; }
        .glow-bg span { position: absolute; width: 400px; height: 400px; background: radial-gradient(circle, rgba(180,133,84,0.15) 0%, transparent 70%); border-radius: 50%; filter: blur(80px); animation: glowMove 20s infinite alternate ease-in-out; }
        .glow-bg span:nth-child(1) { top: -100px; right: -100px; width: 500px; height: 500px; background: radial-gradient(circle, rgba(180,133,84,0.12) 0%, transparent 70%); }
        .glow-bg span:nth-child(2) { bottom: -150px; left: -150px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(100,150,200,0.1) 0%, transparent 70%); }
        .glow-bg span:nth-child(3) { top: 30%; left: 30%; width: 300px; height: 300px; background: radial-gradient(circle, rgba(180,133,84,0.1) 0%, transparent 70%); animation-delay: -5s; }
        @keyframes glowMove { 0% { transform: translate(0, 0) scale(1); opacity: 0.5; } 100% { transform: translate(40px, -30px) scale(1.2); opacity: 0.8; } }
        .floating-shape { position: absolute; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(184,134,11,0.1) 0%, transparent 70%); z-index: 0; pointer-events: none; }
        .shape-1 { top: -100px; right: -100px; animation: float 20s infinite ease-in-out; }
        .shape-2 { bottom: -50px; left: -50px; width: 200px; height: 200px; animation: float 15s infinite ease-in-out reverse; }
        @keyframes float { 0% { transform: translate(0,0) rotate(0deg); } 33% { transform: translate(30px,-30px) rotate(5deg); } 66% { transform: translate(-20px,20px) rotate(-5deg); } 100% { transform: translate(0,0) rotate(0deg); } }
        .hero-mini {
            background: linear-gradient(135deg, var(--dark) 0%, var(--dark-light) 100%);
            color: white;
            text-align: center;
            padding: 3rem 1rem;
            border-bottom: 4px solid var(--gold);
            position: relative;
            overflow: hidden;
            z-index: 2;
        }
        .hero-mini::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(184,134,11,0.2) 0%, transparent 60%);
            animation: rotate 40s linear infinite;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .hero-mini h2 {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--gold-light);
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 2;
        }
        .hero-mini p {
            font-size: 1.2rem;
            max-width: 700px;
            margin: 0 auto;
            opacity: 0.95;
            position: relative;
            z-index: 2;
        }
        .calc-wrapper {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
            position: relative;
            z-index: 2;
        }
        .calc-box {
            background: var(--bg-panel);
            backdrop-filter: blur(15px);
            border: 2px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-soft);
            position: relative;
            overflow: hidden;
        }
        .calc-box:hover {
            box-shadow: var(--shadow-glow);
            border-color: rgba(180,133,84,0.4);
        }
        .featured-badge {
            position: absolute;
            top: -10px;
            left: -10px;
            background: linear-gradient(135deg, var(--accent-glow), var(--gold-light));
            color: #111;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            font-weight: 900;
            border: 3px solid white;
            z-index: 10;
        }
        .featured-badge i { font-size: 1.8rem; margin-bottom: 0.2rem; color: #0b0e17; }
        .featured-badge span { font-size: 0.8rem; text-align: center; color: #0b0e17; }
        .calc-box h2 {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #f0e6d2, #cfa776);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .section-title-sm {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--accent-soft) !important;
            background: none !important;
            -webkit-text-fill-color: var(--accent-soft) !important;
            margin: 1.2rem 0 0.8rem 0;
            border-bottom: 2px solid var(--border-light);
            padding-bottom: 0.3rem;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .currency-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(180,133,84,0.15);
            border: 1px solid var(--border-light);
            padding: 0.8rem 1rem;
            border-radius: 50px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .currency-row label {
            font-weight: 700;
            color: var(--accent-soft);
            margin: 0;
        }
        .currency-row select, .currency-row input {
            padding: 0.5rem 1rem;
            border: 2px solid var(--border-light);
            border-radius: 30px;
            background: rgba(10,14,23,0.7);
            color: var(--text-light);
            font-weight: 700;
            font-family: 'Inter', sans-serif;
        }
        .currency-row select { width: 150px; }
        .currency-row input { width: 250px; }
        .currency-row select option { background: #0b0e17; color: #f0f4fa; }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.2rem;
            margin-bottom: 1.5rem;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .input-group label {
            font-weight: 700;
            color: var(--accent-soft);
            font-size: 0.85rem;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 0.7rem 1rem;
            background: rgba(10,14,23,0.7);
            border: 2px solid var(--border-light);
            border-radius: 30px;
            color: var(--text-light);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: var(--transition);
        }
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: var(--accent-glow);
            box-shadow: 0 0 0 3px rgba(180,133,84,0.2);
        }
        .btn-primary {
            background: rgba(180,133,84,0.2);
            border: 1px solid var(--border-light);
            border-radius: 40px;
            padding: 0.8rem 2rem;
            color: var(--accent-soft);
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Tajawal', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            backdrop-filter: blur(5px);
        }
        .btn-primary:hover {
            background: rgba(180,133,84,0.4);
            color: #fff;
            border-color: var(--accent-glow);
            box-shadow: 0 0 20px rgba(180,133,84,0.3);
            transform: translateY(-2px);
        }
        .btn-primary.centered {
            width: 100%;
            justify-content: center;
            padding: 1rem;
            font-size: 1.1rem;
        }
        .table-container {
            overflow-x: auto;
            margin-top: 1rem;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            background: var(--bg-card);
            padding: 0.8rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th {
            background: rgba(180,133,84,0.2);
            color: var(--accent-soft);
            font-weight: 900;
            padding: 0.5rem;
            border-bottom: 2px solid var(--border-light);
        }
        td {
            padding: 0.5rem;
            border-bottom: 1px solid rgba(180,133,84,0.2);
            text-align: center;
            color: var(--text-light);
        }
        tr:last-child td { border-bottom: none; }
        .result-highlight {
            font-size: 2rem;
            font-weight: 900;
            color: var(--gold-light);
            text-align: center;
            padding: 0.5rem;
        }
        .badge {
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .badge-excellent { background: #28a745; color: white; }
        .badge-good { background: #17a2b8; color: white; }
        .badge-fair { background: #ffc107; color: #333; }
        .badge-poor { background: #dc3545; color: white; }
        .chart-container {
            margin-top: 2rem;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 1rem;
            border: 1px solid var(--border-light);
            height: 320px;
        }
        .export-container {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 1.5rem 0;
        }
        .export-btn {
            background: rgba(180,133,84,0.2);
            border: 1px solid var(--border-light);
            border-radius: 50px;
            padding: 0.8rem 2rem;
            font-weight: 700;
            color: var(--accent-soft);
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Tajawal', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }
        .export-btn:hover {
            background: rgba(180,133,84,0.4);
            color: #fff;
            border-color: var(--accent-glow);
            transform: translateY(-2px);
        }
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }
        .summary-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 1rem;
            text-align: center;
        }
        .summary-card .number {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--accent-soft);
        }
        .summary-card .label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .footer-simple {
            text-align: center;
            padding: 1.5rem;
            margin-top: 2rem;
            background: rgba(10,14,23,0.5);
            backdrop-filter: blur(5px);
            border-top: 1px solid var(--border-light);
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .footer-simple span {
            color: var(--accent-soft);
            font-weight: 700;
        }
        .home-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(180,133,84,0.9);
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-family: 'Tajawal', sans-serif;
            font-weight: bold;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .home-btn:hover {
            background: #b48554;
            transform: scale(1.05);
        }
        .calc-floating-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(180,133,84,0.2);
            border: 1px solid var(--border-light);
            border-radius: 50px;
            padding: 0.8rem 1.2rem;
            color: var(--accent-soft);
            font-size: 1rem;
            font-weight: 700;
            z-index: 100;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Tajawal', sans-serif;
        }
        .calc-floating-btn:hover {
            background: rgba(180,133,84,0.4);
            color: #fff;
            border-color: var(--accent-glow);
            box-shadow: 0 0 15px rgba(180,133,84,0.3);
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: var(--bg-panel);
            margin: 5% auto;
            padding: 0;
            border: 2px solid var(--border-light);
            border-radius: 30px;
            width: 90%;
            max-width: 300px;
            box-shadow: var(--shadow-glow);
        }
        .modal-header {
            background: rgba(180,133,84,0.15);
            border-bottom: 2px solid var(--border-light);
            padding: 10px 15px;
            border-radius: 28px 28px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-header h2 {
            margin: 0;
            color: var(--accent-soft);
            font-size: 1rem;
            font-weight: 900;
        }
        .close {
            color: var(--text-muted);
            float: left;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover { color: var(--accent-glow); }
        .modal-body { padding: 15px; }
        .calc-display {
            width: 100%;
            height: 45px;
            font-size: 1.4rem;
            text-align: left;
            padding: 0 10px;
            border: 2px solid var(--border-light);
            border-radius: 20px;
            margin-bottom: 15px;
            background: rgba(10,14,23,0.8);
            color: var(--accent-soft);
            font-family: 'Inter', monospace;
            direction: ltr;
        }
        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        .calc-btn {
            background: rgba(180,133,84,0.1);
            border: 1px solid var(--border-light);
            border-radius: 15px;
            padding: 10px 0;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-light);
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
        }
        .calc-btn:hover {
            background: rgba(180,133,84,0.3);
            border-color: var(--accent-glow);
        }
        .calc-btn.operator { color: var(--accent-soft); }
        .calc-btn.equals {
            background: rgba(180,133,84,0.3);
            color: white;
            grid-column: span 2;
        }
        .calc-btn.equals:hover {
            background: rgba(180,133,84,0.5);
        }
        .recommendation-box {
            background: rgba(10,14,23,0.5);
            border-radius: var(--radius-md);
            padding: 1rem 1.5rem;
            margin: 1rem 0;
            border-right: 4px solid var(--accent-glow);
            text-align: right;
        }
        .recommendation-box h4 {
            color: var(--accent-soft);
            margin-bottom: 0.5rem;
        }
        .recommendation-box p {
            color: var(--text-light);
            line-height: 1.7;
        }
        @media (max-width: 768px) {
            .hero-mini h2 { font-size: 2rem; }
            .hero-mini p { font-size: 1rem; }
            .calc-box { padding: 1rem; }
            .featured-badge { width: 70px; height: 70px; }
            .featured-badge i { font-size: 1.4rem; }
            .featured-badge span { font-size: 0.6rem; }
            .currency-row select, .currency-row input { width: 100%; }
            .input-grid { grid-template-columns: 1fr; }
            .chart-container { height: 250px; }
        }
    </style>
</head>
<body>
    <div class="glow-bg"><span></span><span></span><span></span></div>
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>

    <section class="hero-mini">
        <h2>📊 حاسبة CAC و CLV</h2>
        <p>قياس مدى جدوى استثمارك التسويقي – هل تكلفة جلب العميل تعود عليك بربح؟</p>
    </section>

    <section class="calc-wrapper">
        <div class="calc-box" data-aos="fade-up">
            <div class="featured-badge"><i class="fas fa-users"></i><span>ولاء</span></div>
            <h2>تحليل تكلفة الاستحواذ مقابل القيمة الدائمة</h2>

            <!-- خيارات العملة واسم الجهة -->
            <div class="currency-row">
                <label><i class="fas fa-coins"></i> العملة:</label>
                <select id="currencySelect">
                    <option value="$" selected>دولار ($)</option>
                    <option value="€">يورو (€)</option>
                    <option value="₺">ليرة تركية (₺)</option>
                    <option value="ج.م">جنيه مصري (ج.م)</option>
                    <option value="د.ك">دينار كويتي (د.ك)</option>
                    <option value="ر.س">ريال سعودي (ر.س)</option>
                </select>
                <label><i class="fas fa-building"></i> اسم الجهة:</label>
                <input type="text" id="companyName" value="الشركة / المنشأة" placeholder="اسم الجهة">
            </div>

            <!-- بيانات الإدخال -->
            <div class="input-grid">
                <div class="input-group">
                    <label><i class="fas fa-ad"></i> إجمالي مصاريف التسويق (شهرياً)</label>
                    <input type="number" id="marketingSpend" value="5000" step="100">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-user-plus"></i> عدد العملاء الجدد (شهرياً)</label>
                    <input type="number" id="newCustomers" value="100" step="1">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-receipt"></i> متوسط قيمة الطلب</label>
                    <input type="number" id="avgOrderValue" value="25" step="0.5">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-calendar-check"></i> عدد الزيارات لكل عميل بالسنة</label>
                    <input type="number" id="visitsPerYear" value="12" step="1">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-clock"></i> متوسط سنوات بقاء العميل</label>
                    <input type="number" id="customerLifespan" value="3" step="0.5">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-percent"></i> هامش الربح (%)</label>
                    <input type="number" id="profitMargin" value="30" step="1">
                </div>
            </div>

            <!-- زر الحساب -->
            <button class="btn-primary centered" id="calculateBtn"><i class="fas fa-calculator"></i> احسب CAC و CLV</button>

            <!-- منطقة النتائج -->
            <div id="resultsArea" style="display:none; margin-top: 2rem;">
                <div class="section-title-sm">📊 ملخص المؤشرات</div>
                <div class="summary-cards" id="summaryCards"></div>

                <div class="section-title-sm">📈 تحليل الجدوى (CAC vs CLV)</div>
                <div class="chart-container"><canvas id="cacClvChart"></canvas></div>

                <div class="section-title-sm">📋 التوصيات الاستراتيجية</div>
                <div class="recommendation-box" id="recommendationBox"></div>

                <div class="section-title-sm">📄 تفاصيل الحساب</div>
                <div class="table-container" id="detailsTable"></div>

                <div class="export-container">
                    <button class="export-btn" id="exportWordBtn"><i class="fas fa-file-word"></i> تقرير Word</button>
                    <button class="export-btn" id="exportExcelBtn"><i class="fas fa-file-excel"></i> تصدير Excel</button>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer-simple">جميع الحقوق محفوظة © 2026 <span>FAROUK GRUP</span></footer>

    <!-- آلة حاسبة منبثقة -->
    <div class="calc-floating-btn" id="calculatorBtn"><i class="fas fa-calculator"></i> آلة حاسبة</div>
    <div id="calculatorModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><span class="close">&times;</span><h2><i class="fas fa-calculator" style="color: var(--accent-soft);"></i> آلة حاسبة</h2></div>
            <div class="modal-body">
                <input type="text" id="calcDisplay" class="calc-display" readonly>
                <div class="calc-buttons">
                    <button class="calc-btn" onclick="handleCalculatorInput('9')">9</button><button class="calc-btn" onclick="handleCalculatorInput('8')">8</button><button class="calc-btn" onclick="handleCalculatorInput('7')">7</button><button class="calc-btn operator" onclick="handleCalculatorInput('/')">÷</button>
                    <button class="calc-btn" onclick="handleCalculatorInput('6')">6</button><button class="calc-btn" onclick="handleCalculatorInput('5')">5</button><button class="calc-btn" onclick="handleCalculatorInput('4')">4</button><button class="calc-btn operator" onclick="handleCalculatorInput('*')">×</button>
                    <button class="calc-btn" onclick="handleCalculatorInput('3')">3</button><button class="calc-btn" onclick="handleCalculatorInput('2')">2</button><button class="calc-btn" onclick="handleCalculatorInput('1')">1</button><button class="calc-btn operator" onclick="handleCalculatorInput('-')">-</button>
                    <button class="calc-btn" onclick="clearCalculator()">C</button><button class="calc-btn" onclick="handleCalculatorInput('.')">.</button><button class="calc-btn" onclick="handleCalculatorInput('0')">0</button><button class="calc-btn operator" onclick="handleCalculatorInput('+')">+</button>
                    <button class="calc-btn" onclick="backspaceCalculator()">⌫</button><button class="calc-btn equals" onclick="calculateCalculatorResult()" style="grid-column: span 3;">=</button>
                </div>
            </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true, offset: 100 });

        // ============================================================
        // الحساب الرئيسي
        // ============================================================
        function calculateCACCLV() {
            const currency = document.getElementById('currencySelect').value;
            const company = document.getElementById('companyName').value || 'الجهة';

            const marketingSpend = parseFloat(document.getElementById('marketingSpend').value) || 0;
            const newCustomers = parseInt(document.getElementById('newCustomers').value) || 1;
            const avgOrder = parseFloat(document.getElementById('avgOrderValue').value) || 0;
            const visitsPerYear = parseInt(document.getElementById('visitsPerYear').value) || 1;
            const lifespan = parseFloat(document.getElementById('customerLifespan').value) || 1;
            const profitMargin = parseFloat(document.getElementById('profitMargin').value) || 0;

            if (marketingSpend <= 0 || newCustomers <= 0 || avgOrder <= 0 || visitsPerYear <= 0 || lifespan <= 0 || profitMargin <= 0) {
                alert('الرجاء إدخال قيم موجبة لجميع الحقول.');
                return;
            }

            // حسابات CAC
            const cac = marketingSpend / newCustomers;

            // حسابات CLV
            const annualRevenuePerCustomer = avgOrder * visitsPerYear;
            const lifetimeRevenue = annualRevenuePerCustomer * lifespan;
            const clv = lifetimeRevenue * (profitMargin / 100);

            // النسبة
            const ratio = clv / cac;

            // التصنيف والتوصية
            let status, badgeClass, recommendation;
            if (ratio >= 4) {
                status = 'ممتاز';
                badgeClass = 'badge-excellent';
                recommendation = `✅ نسبة ${ratio.toFixed(2)} تعني أن كل دولار تنفقه على التسويق يعود عليك بأكثر من 4 دولارات أرباح. استراتيجيتك التسويقية ممتازة ومستدامة. استمر في الاستثمار وابحث عن فرص للتوسع.`;
            } else if (ratio >= 3) {
                status = 'جيد جداً';
                badgeClass = 'badge-good';
                recommendation = `✅ نسبة ${ratio.toFixed(2)} تعني أن استثمارك التسويقي مجدٍ. يمكنك تحسين الأداء بزيادة متوسط قيمة الطلب أو تحسين الاحتفاظ بالعملاء.`;
            } else if (ratio >= 2) {
                status = 'متوسط';
                badgeClass = 'badge-fair';
                recommendation = `🟡 نسبة ${ratio.toFixed(2)} تشير إلى أن العائد ليس كافياً. راجع قنوات التسويق، أو حاول خفض التكاليف، أو زيادة متوسط العمر الافتراضي للعميل.`;
            } else {
                status = 'ضعيف';
                badgeClass = 'badge-poor';
                recommendation = `🔴 نسبة ${ratio.toFixed(2)} تعني أنك تخسر أموالك في التسويق. أنت بحاجة إلى إعادة هيكلة جذرية: خفض تكلفة الاستحواذ، رفع الأسعار، أو تحسين ولاء العملاء.`;
            }

            // عرض النتائج
            displayResults({ cac, clv, ratio, status, badgeClass, recommendation, currency, company });
        }

        // ============================================================
        // عرض النتائج
        // ============================================================
        let chartInstance = null;

        function displayResults(data) {
            const area = document.getElementById('resultsArea');
            area.style.display = 'block';

            // بطاقات الملخص
            document.getElementById('summaryCards').innerHTML = `
                <div class="summary-card"><div class="number">${data.currency}${data.cac.toFixed(2)}</div><div class="label">تكلفة الاستحواذ (CAC)</div></div>
                <div class="summary-card"><div class="number">${data.currency}${data.clv.toFixed(2)}</div><div class="label">القيمة الدائمة (CLV)</div></div>
                <div class="summary-card"><div class="number">${data.ratio.toFixed(2)}x</div><div class="label">نسبة CLV / CAC</div></div>
                <div class="summary-card"><div class="number"><span class="badge ${data.badgeClass}">${data.status}</span></div><div class="label">التصنيف</div></div>
            `;

            // التوصيات
            document.getElementById('recommendationBox').innerHTML = `
                <h4><i class="fas fa-lightbulb" style="color: var(--accent-glow);"></i> التوصية الاستراتيجية</h4>
                <p>${data.recommendation}</p>
            `;

            // جدول التفاصيل
            document.getElementById('detailsTable').innerHTML = `
                <table>
                    <thead><tr><th>المؤشر</th><th>القيمة</th><th>الشرح</th></tr></thead>
                    <tbody>
                        <tr><td>إجمالي مصاريف التسويق</td><td>${data.currency}${document.getElementById('marketingSpend').value}</td><td>المبلغ المنفق على الإعلانات والعروض شهرياً</td></tr>
                        <tr><td>عدد العملاء الجدد</td><td>${document.getElementById('newCustomers').value}</td><td>عدد العملاء الذين تم جلبهم خلال الشهر</td></tr>
                        <tr><td>تكلفة الاستحواذ (CAC)</td><td>${data.currency}${data.cac.toFixed(2)}</td><td>المصاريف ÷ عدد العملاء الجدد</td></tr>
                        <tr><td>متوسط قيمة الطلب</td><td>${data.currency}${document.getElementById('avgOrderValue').value}</td><td>متوسط ما ينفقه العميل في كل زيارة</td></tr>
                        <tr><td>الزيارات السنوية</td><td>${document.getElementById('visitsPerYear').value}</td><td>عدد مرات الشراء في السنة</td></tr>
                        <tr><td>سنوات البقاء</td><td>${document.getElementById('customerLifespan').value}</td><td>متوسط المدة التي يبقى فيها العميل</td></tr>
                        <tr><td>هامش الربح</td><td>${document.getElementById('profitMargin').value}%</td><td>نسبة الربح الصافي من كل عملية بيع</td></tr>
                        <tr><td><strong>القيمة الدائمة (CLV)</strong></td><td><strong>${data.currency}${data.clv.toFixed(2)}</strong></td><td>الإيرادات × هامش الربح طوال فترة العميل</td></tr>
                        <tr><td><strong>نسبة CLV / CAC</strong></td><td><strong>${data.ratio.toFixed(2)}x</strong></td><td>مؤشر الجدوى (يفضل أن تكون ≥ 3)</td></tr>
                    </tbody>
                </table>
            `;

            // رسم بياني
            const ctx = document.getElementById('cacClvChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['تكلفة الاستحواذ (CAC)', 'القيمة الدائمة (CLV)'],
                    datasets: [{
                        label: 'القيمة بالعملة',
                        data: [data.cac, data.clv],
                        backgroundColor: ['rgba(220,53,69,0.7)', 'rgba(40,167,69,0.7)'],
                        borderColor: ['#dc3545', '#28a745'],
                        borderWidth: 2,
                        borderRadius: 8,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `${data.currency}${context.parsed.y.toFixed(2)}`;
                                }
                            }
                        },
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: '#aab7d4', callback: function(value) { return data.currency + value; } },
                            grid: { color: 'rgba(180,133,84,0.2)' }
                        },
                        x: {
                            ticks: { color: '#aab7d4' },
                            grid: { display: false }
                        }
                    }
                }
            });

            // تخزين النتائج للتصدير
            window.lastResults = data;
        }

        // ============================================================
        // تصدير Excel احترافي
        // ============================================================
        async function exportExcel() {
            if (!window.lastResults) { alert('الرجاء إجراء الحساب أولاً.'); return; }
            const data = window.lastResults;
            const currency = document.getElementById('currencySelect').value;
            const company = document.getElementById('companyName').value || 'الجهة';

            const workbook = new ExcelJS.Workbook();
            workbook.creator = 'FAROUK GRUP';
            workbook.created = new Date();

            const ws = workbook.addWorksheet('CAC_CLV', { views: [{ rightToLeft: true, showGridLines: false }] });

            const G = 'FFB48554', GL = 'FFCFA776', DB = 'FF0B0E17', HB = 'FF1A2035', SB = 'FF243050';
            const AR = 'FFF5F0E8', W = 'FFFFFFFF', DT = 'FF1A1A1A';

            function headerStyle(bg = HB, tc = GL) {
                return {
                    font: { name: 'Arial', bold: true, size: 11, color: { argb: tc } },
                    fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: bg } },
                    alignment: { horizontal: 'center', vertical: 'middle', wrapText: true, readingOrder: 'rtl' },
                    border: {
                        top: { style: 'thin', color: { argb: G } },
                        bottom: { style: 'thin', color: { argb: G } },
                        left: { style: 'thin', color: { argb: G } },
                        right: { style: 'thin', color: { argb: G } }
                    }
                };
            }

            function cellStyle(bg = W, tc = DT, bold = false, h = 'center') {
                return {
                    font: { name: 'Arial', bold: bold, size: 10, color: { argb: tc } },
                    fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: bg } },
                    alignment: { horizontal: h, vertical: 'middle', wrapText: true, readingOrder: 'rtl' },
                    border: {
                        top: { style: 'hair', color: { argb: 'FFCCCCCC' } },
                        bottom: { style: 'hair', color: { argb: 'FFCCCCCC' } },
                        left: { style: 'hair', color: { argb: 'FFCCCCCC' } },
                        right: { style: 'hair', color: { argb: 'FFCCCCCC' } }
                    }
                };
            }

            function mergeAndSet(ws, row, col1, col2, text, bg = HB, tc = GL, fs = 12) {
                ws.mergeCells(row, col1, row, col2);
                const c = ws.getCell(row, col1);
                c.value = text;
                c.font = { name: 'Arial', bold: true, size: fs, color: { argb: tc } };
                c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bg } };
                c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true, readingOrder: 'rtl' };
                c.border = {
                    top: { style: 'medium', color: { argb: G } },
                    bottom: { style: 'medium', color: { argb: G } },
                    left: { style: 'medium', color: { argb: G } },
                    right: { style: 'medium', color: { argb: G } }
                };
            }

            ws.getColumn(1).width = 5;
            ws.getColumn(2).width = 30;
            ws.getColumn(3).width = 20;
            ws.getColumn(4).width = 40;

            mergeAndSet(ws, 1, 1, 4, `تقرير CAC و CLV - ${company}`, DB, GL, 16);
            ws.getRow(1).height = 40;

            mergeAndSet(ws, 2, 1, 4, `العملة: ${currency}  |  تاريخ التقرير: ${new Date().toLocaleDateString('ar-EG')}`, HB, GL, 11);
            ws.getRow(2).height = 28;

            const headers = ['#', 'المؤشر', 'القيمة', 'الشرح'];
            const headerRow = ws.getRow(3);
            headers.forEach((h, idx) => {
                const cell = ws.getCell(3, idx + 1);
                cell.value = h;
                Object.assign(cell, headerStyle(SB, W));
            });
            ws.getRow(3).height = 28;

            const rows = [
                ['1', 'إجمالي مصاريف التسويق', `${currency}${document.getElementById('marketingSpend').value}`, 'المبلغ المنفق على الإعلانات والعروض شهرياً'],
                ['2', 'عدد العملاء الجدد', document.getElementById('newCustomers').value, 'عدد العملاء الذين تم جلبهم خلال الشهر'],
                ['3', 'تكلفة الاستحواذ (CAC)', `${currency}${data.cac.toFixed(2)}`, 'المصاريف ÷ عدد العملاء الجدد'],
                ['4', 'متوسط قيمة الطلب', `${currency}${document.getElementById('avgOrderValue').value}`, 'متوسط ما ينفقه العميل في كل زيارة'],
                ['5', 'الزيارات السنوية', document.getElementById('visitsPerYear').value, 'عدد مرات الشراء في السنة'],
                ['6', 'سنوات البقاء', document.getElementById('customerLifespan').value, 'متوسط المدة التي يبقى فيها العميل'],
                ['7', 'هامش الربح', `${document.getElementById('profitMargin').value}%`, 'نسبة الربح الصافي من كل عملية بيع'],
                ['8', 'القيمة الدائمة (CLV)', `${currency}${data.clv.toFixed(2)}`, 'الإيرادات × هامش الربح طوال فترة العميل'],
                ['9', 'نسبة CLV / CAC', `${data.ratio.toFixed(2)}x`, 'مؤشر الجدوى (يفضل أن تكون ≥ 3)'],
                ['10', 'التصنيف', data.status, data.recommendation]
            ];

            rows.forEach((r, i) => {
                const rowNum = i + 4;
                const bg = i % 2 === 0 ? AR : 'FFFEFCF6';
                const row = ws.getRow(rowNum);
                row.height = 24;
                r.forEach((val, colIdx) => {
                    const cell = ws.getCell(rowNum, colIdx + 1);
                    cell.value = val;
                    Object.assign(cell, cellStyle(bg, DT, false, colIdx === 0 || colIdx === 2 ? 'center' : 'right'));
                    if (colIdx === 3) cell.alignment.horizontal = 'right';
                });
                // تلوين صف التصنيف
                if (r[0] === '10') {
                    const statusCell = ws.getCell(rowNum, 3);
                    if (data.status === 'ممتاز') statusCell.font = { name: 'Arial', bold: true, size: 10, color: { argb: 'FF28A745' } };
                    else if (data.status === 'جيد جداً') statusCell.font = { name: 'Arial', bold: true, size: 10, color: { argb: 'FF17A2B8' } };
                    else if (data.status === 'متوسط') statusCell.font = { name: 'Arial', bold: true, size: 10, color: { argb: 'FFD39C0B' } };
                    else statusCell.font = { name: 'Arial', bold: true, size: 10, color: { argb: 'FFDC3545' } };
                }
            });

            // تذييل
            const footerRow = rows.length + 5;
            ws.mergeCells(footerRow, 1, footerRow, 4);
            const footerCell = ws.getCell(footerRow, 1);
            footerCell.value = 'تم إنشاء التقرير بواسطة مجموعة فاروق للإستشارات والأعمال';
            footerCell.font = { name: 'Arial', size: 9, color: { argb: 'FF888888' } };
            footerCell.alignment = { horizontal: 'center', vertical: 'middle', readingOrder: 'rtl' };
            ws.getRow(footerRow).height = 28;

            const buffer = await workbook.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            saveAs(blob, `CAC_CLV_${company}_${new Date().toISOString().slice(0,10)}.xlsx`);
        }

        // ============================================================
        // تصدير Word
        // ============================================================

            const data = window.lastResults;
            const currency = document.getElementById('currencySelect').value;
            const company = document.getElementById('companyName').value || 'الجهة';

            const htmlContent = `
                <html dir="rtl">
                <head><meta charset="UTF-8"><style>
                    body { font-family: Arial, sans-serif; padding: 30px; direction: rtl; }

                <body>

                    <table>
                        <thead><tr><th>المؤشر</th><th>القيمة</th></tr></thead>
                        <tbody>
                            <tr><td>إجمالي مصاريف التسويق</td><td>${currency}${document.getElementById('marketingSpend').value}</td></tr>
                            <tr><td>عدد العملاء الجدد</td><td>${document.getElementById('newCustomers').value}</td></tr>
                            <tr><td><strong>تكلفة الاستحواذ (CAC)</strong></td><td><strong>${currency}${data.cac.toFixed(2)}</strong></td></tr>
                            <tr><td>متوسط قيمة الطلب</td><td>${currency}${document.getElementById('avgOrderValue').value}</td></tr>
                            <tr><td>الزيارات السنوية</td><td>${document.getElementById('visitsPerYear').value}</td></tr>
                            <tr><td>سنوات البقاء</td><td>${document.getElementById('customerLifespan').value}</td></tr>
                            <tr><td>هامش الربح</td><td>${document.getElementById('profitMargin').value}%</td></tr>
                            <tr><td><strong>القيمة الدائمة (CLV)</strong></td><td><strong>${currency}${data.clv.toFixed(2)}</strong></td></tr>
                            <tr><td><strong>نسبة CLV / CAC</strong></td><td><strong>${data.ratio.toFixed(2)}x</strong></td></tr>
                            <tr><td><strong>التصنيف</strong></td><td>${data.status}</td></tr>
                        </tbody>
                    </table>
                    <div class="rec">
                        <h3>📌 التوصية الاستراتيجية</h3>
                        <p>${data.recommendation}</p>
                    </div>
                    <div class="footer">تم إنشاء التقرير بواسطة مجموعة فاروق للإستشارات والأعمال</div>
                </body>
                </html>
            `;
            const blob = new Blob([htmlContent], { type: 'application/msword' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `CAC_CLV_${company}_${new Date().toISOString().slice(0,10)}.doc`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        // ============================================================
        // ربط الأزرار
        // ============================================================
        document.getElementById('calculateBtn').addEventListener('click', calculateCACCLV);
        document.getElementById('exportWordBtn').addEventListener('click', exportWord);
        document.getElementById('exportExcelBtn').addEventListener('click', exportExcel);

        // ============================================================
        // آلة حاسبة منبثقة
        // ============================================================
        const calcDisplay = document.getElementById('calcDisplay');
        let currentCalcInput = '';
        function safeEvaluate(expr) {
            let e = expr.replace(/\s+/g, '').replace(/×/g, '*').replace(/÷/g, '/');
            if (!/^[0-9+\-*/().]+$/.test(e)) throw new Error('تعبير غير صالح');
            return new Function('return ' + e)();
        }
        window.handleCalculatorInput = v => { currentCalcInput += v; calcDisplay.value = currentCalcInput; };
        window.clearCalculator = () => { currentCalcInput = ''; calcDisplay.value = ''; };
        window.backspaceCalculator = () => { currentCalcInput = currentCalcInput.slice(0, -1); calcDisplay.value = currentCalcInput; };
        window.calculateCalculatorResult = () => {
            try { let r = safeEvaluate(currentCalcInput); calcDisplay.value = r; currentCalcInput = r.toString(); } catch { calcDisplay.value = 'خطأ'; currentCalcInput = ''; }
        };
        const modalCalc = document.getElementById('calculatorModal');
        document.getElementById('calculatorBtn').onclick = e => { e.preventDefault(); modalCalc.style.display = 'block'; };
        document.querySelector('#calculatorModal .close').onclick = () => { modalCalc.style.display = 'none'; };
        window.onclick = e => { if (e.target == modalCalc) modalCalc.style.display = 'none'; };
        document.addEventListener('keydown', e => {
            if (modalCalc.style.display !== 'block') return;
            const key = e.key;
            e.preventDefault();
            if (key >= '0' && key <= '9') handleCalculatorInput(key);
            else if (key === '.') handleCalculatorInput('.');
            else if (key === '+' || key === '-' || key === '*' || key === '/') handleCalculatorInput(key);
            else if (key === 'Enter' || key === '=') calculateCalculatorResult();
            else if (key === 'Backspace') backspaceCalculator();
            else if (key === 'Escape') modalCalc.style.display = 'none';
            else if (key === 'c' || key === 'C') clearCalculator();
        });
    </script>
</body>
</html>
