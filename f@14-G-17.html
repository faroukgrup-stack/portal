<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اشتراك سنوي مدفوع | FAROUK GRUP</title>
    <meta name="description" content="اشترك لمدة سنة كاملة في المنصة الشاملة من مجموعة فاروق.">
    <meta name="robots" content="noindex, follow">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root {
            --gold: #b8860b;
            --gold-light: #d4b15a;
            --gold-soft: rgba(184, 134, 11, 0.08);
            --dark: #0f0f0f;
            --dark-light: #1a1a1a;
            --grey: #333;
            --light: #f5f5f5;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: radial-gradient(circle at 70% 30%, #1a1f2b, #0a0d14);
            color: #f0f4fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -120px;
            right: -120px;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(184, 134, 11, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatGlow 8s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -100px;
            left: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(212, 177, 90, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatGlow 10s ease-in-out infinite reverse;
        }

        @keyframes floatGlow {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -25px) scale(1.08); }
            66% { transform: translate(-20px, 20px) scale(0.94); }
        }

        .mini-nav {
            position: absolute;
            top: 20px;
            right: 30px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mini-nav .logo-sm {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--gold-light);
            font-family: 'Alexandria', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            background: rgba(18, 24, 36, 0.75);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid rgba(184, 134, 11, 0.25);
            transition: all 0.35s ease;
        }

        .mini-nav .logo-sm img {
            height: 28px;
            width: auto;
            object-fit: contain;
            border-radius: 4px;
        }

        .mini-nav .logo-sm:hover {
            background: rgba(184, 134, 11, 0.2);
            border-color: var(--gold);
            color: #fff;
            box-shadow: 0 4px 18px rgba(184, 134, 11, 0.3);
            transform: translateY(-2px);
        }

        .sub-card {
            text-align: center;
            max-width: 480px;
            width: 90%;
            padding: 2.8rem 2.2rem;
            background: rgba(15, 20, 30, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(184, 134, 11, 0.22);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(184, 134, 11, 0.08) inset;
            position: relative;
            z-index: 2;
            transition: all 0.4s ease;
            margin: 100px 0 60px;
        }

        .sub-card:hover {
            border-color: rgba(184, 134, 11, 0.45);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55), 0 0 40px rgba(184, 134, 11, 0.06), 0 0 0 1px rgba(184, 134, 11, 0.12) inset;
        }

        .sub-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 30px;
            right: 30px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
            border-radius: 0 0 3px 3px;
            opacity: 0.8;
        }

        .icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 85px;
            height: 85px;
            margin: 0 auto 1.2rem;
            background: rgba(184, 134, 11, 0.1);
            border: 2px solid rgba(184, 134, 11, 0.35);
            border-radius: 50%;
            position: relative;
            animation: pulseIcon 2.5s ease-in-out infinite;
        }

        .icon-wrapper i {
            font-size: 2.4rem;
            color: var(--gold-light);
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .icon-wrapper:hover i {
            transform: scale(1.15) rotate(-5deg);
        }

        @keyframes pulseIcon {
            0%, 100% { box-shadow: 0 0 0 0 rgba(184, 134, 11, 0.25); }
            50% { box-shadow: 0 0 0 20px rgba(184, 134, 11, 0); }
        }

        .sub-title {
            font-family: 'Cairo', 'Alexandria', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(180deg, var(--gold-light) 20%, var(--gold) 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.3;
            margin-bottom: 0.4rem;
            filter: drop-shadow(0 4px 8px rgba(184, 134, 11, 0.3));
        }

        .sub-desc {
            font-size: 1rem;
            color: #bcc4d0;
            margin-bottom: 1.5rem;
        }

        .price-tag {
            background: rgba(184, 134, 11, 0.12);
            border: 1px dashed var(--gold-light);
            border-radius: 16px;
            padding: 12px 18px;
            margin: 0 auto 1.8rem;
            color: var(--gold-light);
            font-weight: 700;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .input-group {
            margin-bottom: 1rem;
            text-align: right;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid #3a3f4a;
            border-radius: 12px;
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
            box-sizing: border-box;
        }

        .input-group input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 12px rgba(184, 134, 11, 0.25);
        }

        /* تنسيق حقل كلمة المرور مع العين */
        .password-group {
            position: relative;
        }

        .password-group input {
            padding-left: 45px; /* مكان للزر */
        }

        .toggle-password {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px 8px;
            z-index: 2;
            transition: color 0.2s;
            display: flex;
            align-items: center;
        }

        .toggle-password:hover {
            color: var(--gold-light);
        }

        .domain-hint {
            font-size: 0.72rem;
            color: #8895a7;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 1.5rem auto;
            border-radius: 2px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.35s ease;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            white-space: nowrap;
            border: none;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #111;
            box-shadow: 0 6px 20px rgba(184, 134, 11, 0.45);
            width: 100%;
            margin-top: 0.8rem;
        }

        .btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #111, #1f1f1f);
            color: var(--gold);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(184, 134, 11, 0.6);
            border: 1px solid var(--gold);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            filter: grayscale(30%);
        }

        .msg-box {
            margin-top: 1.5rem;
            padding: 14px;
            border-radius: 12px;
            display: none;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
        }

        .success {
            background: rgba(75, 181, 67, 0.15);
            color: #4bb543;
            border: 1px solid #4bb543;
        }

        .error {
            background: rgba(255, 68, 68, 0.15);
            color: #ff6b6b;
            border: 1px solid #ff4444;
        }

        .exists {
            background: rgba(255, 165, 0, 0.12);
            color: #ffa500;
            border: 1px solid #ffa500;
        }

        .renew-link {
            color: var(--gold-light);
            text-decoration: underline;
            font-weight: 700;
            display: inline-block;
            margin-top: 8px;
        }

        .renew-link:hover {
            color: #fff;
        }

        .login-link {
            display: inline-block;
            margin-top: 12px;
            color: var(--gold-light);
            text-decoration: none;
            border: 1px solid var(--gold-light);
            padding: 8px 22px;
            border-radius: 30px;
            transition: 0.3s;
            font-weight: 600;
        }

        .login-link:hover {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
        }

        .login-alt {
            margin-top: 1.2rem;
            font-size: 0.85rem;
            color: #8895a7;
        }

        .login-alt a {
            color: var(--gold-light);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px dashed transparent;
        }

        .login-alt a:hover {
            color: #fff;
            border-bottom-color: var(--gold-light);
        }

        .mini-footer {
            position: absolute;
            bottom: 20px;
            text-align: center;
            font-size: 0.78rem;
            color: #667080;
            z-index: 2;
            width: 100%;
        }

        .mini-footer span {
            color: var(--gold);
            font-weight: 700;
        }

        @media (max-width: 600px) {
            .sub-card {
                padding: 2rem 1.4rem;
                margin: 90px 0 50px;
            }
            .sub-title {
                font-size: 1.8rem;
            }
            .icon-wrapper {
                width: 70px;
                height: 70px;
            }
            .icon-wrapper i {
                font-size: 2rem;
            }
            .btn {
                padding: 12px 20px;
                font-size: 0.9rem;
            }
            .mini-nav {
                top: 10px;
                right: 10px;
            }
            .mini-nav .logo-sm {
                font-size: 0.8rem;
                padding: 6px 12px;
            }
            .mini-nav .logo-sm img {
                height: 22px;
            }
        }

        @media (max-width: 380px) {
            .sub-title {
                font-size: 1.5rem;
            }
            .sub-card {
                padding: 1.6rem 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="mini-nav" data-aos="fade-down" data-aos-duration="700">
        <a href="/" class="logo-sm">
            <img src="https://lh3.googleusercontent.com/d/1e6u-DPTinDJl_Q9wW3QvGgzFbXO_2sXa" alt="FAROUK GRUP LOGO">
            <span>FAROUK GRUP</span>
        </a>
    </div>

    <div class="sub-card" data-aos="zoom-in-up" data-aos-duration="800" data-aos-delay="150">
        <div class="icon-wrapper">
            <i class="fas fa-crown"></i>
        </div>

        <h1 class="sub-title">اشتراك سنوي مدفوع</h1>
        <p class="sub-desc">سنة كاملة من الوصول الشامل لجميع خدمات المنصة</p>

        <div class="price-tag">
            <i class="fas fa-calendar-alt"></i> 365 يوم &bull; <i class="fas fa-infinity"></i> وصول غير محدود
        </div>

        <form id="yearlyForm">
            <div class="input-group">
                <input type="text" name="fullName" placeholder="الاسم الكامل (اختياري)">
            </div>
            <div class="input-group">
                <input type="email" name="username" placeholder="البريد الإلكتروني (مثل Gmail)" required inputmode="email">
                <div class="domain-hint">
                    <i class="fas fa-shield-alt"></i> نطاقات مسموحة فقط: gmail.com, yahoo.com, outlook.com ...
                </div>
            </div>
            <!-- حقل كلمة المرور مع زر العين -->
            <div class="input-group password-group">
                <input type="password" name="password" id="passwordField" placeholder="كلمة المرور للدخول" required minlength="6">
                <button type="button" class="toggle-password" id="togglePasswordBtn" tabindex="-1" aria-label="إظهار كلمة المرور">
                    <i class="fas fa-eye" id="eyeIcon"></i>
                </button>
            </div>

            <button type="submit" class="btn" id="yearlyBtn">
                <i class="fas fa-rocket"></i> تفعيل الاشتراك السنوي
            </button>
        </form>

        <div id="msgBox" class="msg-box"></div>

        <div class="divider"></div>

        <div class="login-alt">
            لديك حساب؟ <a href="https://portal.farouk-grup.com/">تسجيل الدخول</a>
        </div>
    </div>

    <div class="mini-footer">
        جميع الحقوق محفوظة © 2026 <span>FAROUK GRUP</span> &mdash; إسطنبول، تركيا
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 700,
            once: true,
            offset: 50
        });

        // زر العين لإظهار/إخفاء كلمة المرور
        const passwordField = document.getElementById('passwordField');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePasswordBtn.addEventListener('click', function() {
            const isPassword = passwordField.type === 'password';
            passwordField.type = isPassword ? 'text' : 'password';
            eyeIcon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
            togglePasswordBtn.setAttribute('aria-label', isPassword ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');
        });

        // ================ منطق الاشتراك ================
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxmC24dTpDkY8a9kVVqAoKdF5J1v0bKVYGxUiXqZ3rHD0st7yIbp7t9R2oSJSLFIDDN/exec';
        const form = document.getElementById('yearlyForm');
        const btn = document.getElementById('yearlyBtn');
        const msgBox = document.getElementById('msgBox');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            msgBox.style.display = 'none';
            msgBox.className = 'msg-box';

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> جاري التفعيل...';

            const formData = new FormData(this);
            formData.append('action', 'yearRegister');

            fetch(scriptURL, {
                method: 'POST',
                body: formData,
                mode: 'cors'
            })
            .then(response => response.json())
            .then(data => {
                msgBox.style.display = 'block';

                if (data.status === 'success') {
                    msgBox.className = 'msg-box success';
                    msgBox.innerHTML = `
                        <i class="fas fa-check-circle"></i> ${data.message}<br>
                        <a href="${data.loginUrl}" class="login-link" target="_blank">اذهب إلى صفحة الدخول</a>
                    `;
                    form.reset();
                    // إعادة ضبط حقل كلمة المرور والأيقونة بعد إعادة التعيين
                    passwordField.type = 'password';
                    eyeIcon.className = 'fas fa-eye';
                } 
                else if (data.status === 'exists') {
                    msgBox.className = 'msg-box exists';
                    msgBox.innerHTML = `
                        <i class="fas fa-exclamation-triangle"></i> ${data.message}<br>
                        <a href="${data.renewLink}" target="_blank" class="renew-link">اضغط هنا لتجديد الاشتراك</a>
                    `;
                } 
                else {
                    msgBox.className = 'msg-box error';
                    msgBox.textContent = '❌ ' + (data.message || 'حدث خطأ غير معروف');
                }
            })
            .catch(error => {
                msgBox.style.display = 'block';
                msgBox.className = 'msg-box error';
                msgBox.textContent = '❌ تعذر الاتصال بالسيرفر. تأكد من اتصالك وحاول مجدداً.';
                console.error('Fetch error:', error);
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-rocket"></i> تفعيل الاشتراك السنوي';
            });
        });
    </script>
</body>
</html>
