<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اشتراك مجاني 7 أيام - المنصة الشاملة لمجموعة فاروق للإستشارات والأعمال</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: #0b0e17;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .reg-card {
            background: rgba(18, 24, 36, 0.95);
            padding: 35px 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        .reg-card h2 {
            margin-top: 10px;
            margin-bottom: 5px;
            font-size: 1.6rem;
            color: #d4af37;
        }
        .reg-card > p {
            color: #bbb;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
        .password-wrapper {
            position: relative;
            width: 100%;
            margin: 10px 0 0 0;
        }
        .password-wrapper input {
            width: 100%;
            padding: 12px 45px 12px 12px;
            margin: 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            font-family: inherit;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border 0.3s;
        }
        .password-wrapper input:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }
        .toggle-password {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 6px 8px;
            border-radius: 4px;
            transition: color 0.2s;
            z-index: 2;
        }
        .toggle-password:hover {
            color: #d4af37;
        }
        .password-hint {
            font-size: 0.75rem;
            color: #888;
            margin: 6px 0 10px 0;
            text-align: right;
            line-height: 1.4;
        }
        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            font-family: inherit;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border 0.3s;
        }
        input[type="text"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }
        button[type="submit"] {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: linear-gradient(135deg, #d4af37, #aa8a2e);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button[type="submit"]:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .msg-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .success {
            background: rgba(75, 181, 67, 0.15);
            color: #4bb543;
            border: 1px solid #4bb543;
        }
        .error {
            background: rgba(255, 68, 68, 0.15);
            color: #ff4444;
            border: 1px solid #ff4444;
        }
        .exists {
            background: rgba(255, 165, 0, 0.15);
            color: #ffa500;
            border: 1px solid #ffa500;
        }
        .renew-link {
            color: #d4af37;
            text-decoration: underline;
            font-weight: bold;
        }
        .renew-link:hover {
            color: #fff;
        }
        .login-link {
            display: inline-block;
            margin-top: 12px;
            color: #d4af37;
            text-decoration: none;
            border: 1px solid #d4af37;
            padding: 8px 20px;
            border-radius: 30px;
            transition: 0.3s;
            font-weight: bold;
        }
        .login-link:hover {
            background: #d4af37;
            color: #000;
        }
    </style>
</head>
<body>

<div class="reg-card">
    <i class="fas fa-gift" style="font-size: 3rem; color: #d4af37; margin-bottom: 20px;"></i>
    <h2>اشتراك مجاني لمدة 7 أيام</h2>
    <p>أدخل بياناتك للحصول على نسخة تجريبية مجانية</p>

    <form id="freeForm">
        <input type="text" name="fullName" placeholder="الاسم الكامل (اختياري)">
        <input type="email" name="username" placeholder="البريد الإلكتروني" required inputmode="email">

        <!-- حقل كلمة المرور مع زر العين -->
        <div class="password-wrapper">
            <input type="password" name="password" id="passwordField" placeholder="كلمة المرور (للوصول إلى المنصة)" required>
            <button type="button" class="toggle-password" id="togglePasswordBtn" tabindex="-1" aria-label="إظهار كلمة المرور">
                <i class="fas fa-eye" id="eyeIcon"></i>
            </button>
        </div>
        <div class="password-hint">
            <i class="fas fa-info-circle"></i> يجب أن تتكون كلمة المرور من أحرف لاتينية (إنجليزية)، أرقام، ورموز فقط.
        </div>

        <button type="submit" id="freeBtn">احصل على الاشتراك المجاني</button>
    </form>

    <!-- منطقة الرسائل -->
    <div id="msgBox" class="msg-box"></div>

    <div style="margin-top: 20px; font-size: 0.9rem; color: #aaa;">
        لديك حساب بالفعل؟ <a href="https://portal.farouk-grup.com/" style="color: #d4af37;">سجل الدخول</a>
    </div>
</div>

<script>
    // رابط Google Apps Script (استخدم رابطك الفعلي)
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzEKTIjGkqFYe183KqU_oJlKQgYtylaR5m-coI3IjAesafRQpacGpDqWABC5gJWoVxj/exec';

    const form = document.getElementById('freeForm');
    const btn = document.getElementById('freeBtn');
    const msgBox = document.getElementById('msgBox');

    // ─── زر العين لإظهار / إخفاء كلمة المرور ────────
    const passwordField = document.getElementById('passwordField');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePasswordBtn.addEventListener('click', function() {
        const isPassword = passwordField.type === 'password';
        passwordField.type = isPassword ? 'text' : 'password';
        eyeIcon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
        togglePasswordBtn.setAttribute('aria-label', isPassword ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');
    });

    // ─── التحقق من صحة كلمة المرور (لاتينية فقط + أرقام + رموز) ────
    function isValidPassword(password) {
        // يسمح فقط بالأحرف اللاتينية (كبيرة وصغيرة) والأرقام والرموز (المسافة مسموحة)
        const regex = /^[\x20-\x7E]+$/; // كل رموز ASCII القابلة للطباعة
        return regex.test(password);
    }

    // ─── معالجة تقديم النموذج ─────────────────────────
    form.addEventListener('submit', function(e) {
        e.preventDefault();

        // إخفاء الرسائل السابقة
        msgBox.style.display = 'none';
        msgBox.className = 'msg-box';

        // التحقق من كلمة المرور
        const password = passwordField.value;
        if (!isValidPassword(password)) {
            msgBox.style.display = 'block';
            msgBox.className = 'msg-box error';
            msgBox.textContent = '❌ كلمة المرور يجب أن تحتوي على أحرف لاتينية (إنجليزية) وأرقام ورموز فقط.';
            passwordField.focus();
            return;
        }

        // تعطيل الزر أثناء الإرسال
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> جاري المعالجة...';

        const formData = new FormData(this);
        formData.append('action', 'freeRegister');

        fetch(scriptURL, {
            method: 'POST',
            body: formData,
            mode: 'cors'
        })
        .then(response => response.json())
        .then(data => {
            msgBox.style.display = 'block';

            if (data.status === 'success') {
                msgBox.className = 'msg-box success';
                msgBox.innerHTML = `
                    <i class="fas fa-check-circle"></i> ${data.message}<br>
                    <a href="${data.loginUrl}" class="login-link" target="_blank">اذهب إلى صفحة الدخول</a>
                `;
                form.reset();
                passwordField.type = 'password';
                eyeIcon.className = 'fas fa-eye';
            } 
            else if (data.status === 'exists') {
                msgBox.className = 'msg-box exists';
                msgBox.innerHTML = `
                    <i class="fas fa-exclamation-triangle"></i> ${data.message}<br>
                    <a href="${data.renewLink}" target="_blank" class="renew-link">اضغط هنا لتجديد الاشتراك</a>
                `;
            } 
            else {
                msgBox.className = 'msg-box error';
                msgBox.textContent = '❌ ' + (data.message || 'حدث خطأ غير معروف');
            }
        })
        .catch(error => {
            msgBox.style.display = 'block';
            msgBox.className = 'msg-box error';
            msgBox.textContent = '❌ تعذر الاتصال بالسيرفر. تأكد من اتصالك بالإنترنت وحاول مجدداً.';
            console.error('Fetch error:', error);
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerHTML = 'احصل على الاشتراك المجاني';
        });
    });
</script>

</body>
</html>
