<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>منصة التحليل الذكي المتكاملة | FAROUK GRUP</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- html2pdf لتصدير PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --gold: #b8860b;
            --gold-light: #d4b15a;
            --gold-soft: rgba(184,134,11,0.1);
            --dark: #0f0f0f;
            --dark-light: #1a1a1a;
            --white: #ffffff;
            --offwhite: #f9f9f9;
            --text: #333;
            --card-bg: #fefcf6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(184,134,11,0.03) 0px, transparent 20px),
                radial-gradient(circle at 90% 70%, rgba(184,134,11,0.03) 0px, transparent 25px),
                repeating-linear-gradient(45deg, rgba(0,0,0,0.01) 0px, rgba(0,0,0,0.01) 1px, transparent 1px, transparent 10px);
            pointer-events: none; z-index: -1;
        }

        .floating-shape {
            position: absolute;
            width: 300px; height: 300px; border-radius: 50%;
            background: radial-gradient(circle, rgba(184,134,11,0.1) 0%, transparent 70%);
            z-index: 0; pointer-events: none;
        }

        .shape-1 { top: -100px; right: -100px; animation: float 20s infinite ease-in-out; }
        .shape-2 { bottom: -50px; left: -50px; width: 200px; height: 200px; animation: float 15s infinite ease-in-out reverse; }

        @keyframes float {
            0% { transform: translate(0,0) rotate(0deg); }
            33% { transform: translate(30px,-30px) rotate(5deg); }
            66% { transform: translate(-20px,20px) rotate(-5deg); }
            100% { transform: translate(0,0) rotate(0deg); }
        }

        /* Navigation */
        nav {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0,0,0,0.05);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo img {
            height: 50px;
            width: auto;
            object-fit: contain;
        }

        .logo h1 {
            font-family: 'Alexandria', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 1px;
        }

        nav a {
            text-decoration: none;
            color: #444;
            margin: 0 0.8rem;
            font-weight: 600;
            transition: 0.3s;
        }
        nav a:hover { color: var(--gold); }
        nav a i { margin-left: 5px; }

        /* Main Container */
        .container {
            max-width: 1000px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
        }

        .tool-card {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(15px);
            border: 2px solid var(--gold);
            border-radius: 40px;
            padding: 3rem;
            box-shadow: 0 30px 60px rgba(0,0,0,0.2), 0 0 0 1px rgba(184,134,11,0.3) inset;
            position: relative;
            overflow: hidden;
        }

        .tool-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, transparent 0%, rgba(184,134,11,0.05) 100%);
            z-index: -1;
        }

        h2 {
            color: var(--gold);
            text-align: center;
            margin-bottom: 30px;
            font-weight: 900;
            font-size: 2rem;
        }

        .form-group { margin-bottom: 25px; }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            color: var(--dark);
        }

        label i { color: var(--gold); margin-left: 0.5rem; }

        input, select, textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 30px;
            font-family: 'Tajawal', sans-serif;
            font-size: 1rem;
            transition: 0.3s;
            background: var(--offwhite);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(184,134,11,0.2);
            background: var(--white);
        }

        textarea {
            min-height: 400px;  /* مربع كبير لتحليل التقارير الطويلة */
            resize: vertical;
        }

        .btn-main {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #111;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 20px rgba(184,134,11,0.4);
        }

        .btn-main:hover {
            background: linear-gradient(135deg, #111, #222);
            color: var(--gold);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(184,134,11,0.6);
        }

        #outputSection {
            margin-top: 40px;
            display: none;
        }

        .action-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            justify-content: flex-start;
            flex-wrap: wrap;
        }

        .btn-export {
            padding: 12px 25px;
            border-radius: 50px;
            border: none;
            color: white;
            cursor: pointer;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            transition: 0.2s;
        }
        .btn-export:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .bg-pdf { background: #e74c3c; }
        .bg-word { background: #2b579a; }

        .result-container {
            background: var(--offwhite);
            border: 2px solid var(--gold);
            border-radius: 30px;
            padding: 2rem;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
            width: 100%;
            min-height: 200px;
        }

        .content-card {
            background: linear-gradient(135deg, var(--card-bg) 0%, #fff 100%);
            border: 1px solid var(--gold-light);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: 0.3s;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .content-card:last-child { margin-bottom: 0; }
        .content-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(184,134,11,0.1);
            border-color: var(--gold);
        }

        .content-card h3 {
            color: var(--gold);
            margin-bottom: 15px;
            font-size: 1.3rem;
            border-bottom: 2px solid var(--gold-soft);
            padding-bottom: 10px;
        }

        .content-card p {
            margin-bottom: 10px;
            line-height: 1.8;
        }
        .content-card p:last-child { margin-bottom: 0; }

        .loading {
            text-align: center;
            padding: 40px;
            font-weight: bold;
            color: var(--gold);
            font-size: 1.2rem;
        }

        /* Footer */
        footer {
            background: linear-gradient(145deg, #111, #1a1a1a);
            color: #ddd;
            padding: 3rem 1rem 2rem;
            border-top: 3px solid var(--gold);
            margin-top: 40px;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-content {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .footer-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
        }

        .footer-social {
            display: flex;
            gap: 1.5rem;
        }

        .footer-social a {
            color: var(--gold);
            font-size: 1.8rem;
            transition: 0.3s;
        }
        .footer-social a:hover {
            color: var(--gold-light);
            transform: translateY(-3px);
        }

        .footer-logo-box {
            text-align: center;
        }

        .footer-logo-box h2 {
            color: var(--gold);
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .footer-logo-box div {
            width: 60px;
            height: 2px;
            background: var(--gold);
            margin: 0 auto;
        }

        .footer-payment .payment-card {
            background: rgba(255,255,255,0.05);
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            display: flex;
            gap: 1.5rem;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .footer-payment img {
            height: 25px;
            filter: brightness(0.9);
            transition: 0.2s;
        }
        .footer-payment img:hover {
            filter: brightness(1.2);
        }

        hr {
            border: none;
            border-top: 1px solid rgba(184,134,11,0.2);
        }

        .copyright {
            text-align: center;
            font-size: 0.9rem;
            color: #777;
        }
        .copyright span {
            color: var(--gold);
            font-weight: bold;
        }

        /* Responsive */
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                align-items: stretch;
                gap: 0.8rem;
            }
            .logo {
                flex-wrap: nowrap;
                gap: 8px;
                width: 100%;
                justify-content: center;
            }
            .logo img { height: 35px; }
            .logo h1 { font-size: 1rem; }
            nav > div:last-child {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 6px;
            }
            nav a {
                margin: 0;
                font-size: 0.9rem;
                padding: 4px 8px;
                white-space: nowrap;
            }
            .tool-card { padding: 2rem 1.5rem; }
            .action-bar { justify-content: center; }
            .footer-row { flex-direction: column; text-align: center; }
            .footer-social { justify-content: center; }
        }
    </style>
</head>
<body>

<!-- أشكال هندسية عائمة -->
<div class="floating-shape shape-1"></div>
<div class="floating-shape shape-2"></div>

<!-- الهيدر الجديد -->
<nav>
    <div class="logo">
        <img src="https://lh3.googleusercontent.com/d/1e6u-DPTinDJl_Q9wW3QvGgzFbXO_2sXa" alt="FAROUK GRUP LOGO">
        <h1>مجموعة فاروق للاستشارات والأعمال</h1>
    </div>
    <div>
        <a href="https://www.farouk-grup.com/"><i class="fas fa-home"></i> الرئيسية</a>
        <a href="https://www.farouk-grup.com/Home/Contact-Us" style="color:var(--gold)"><i class="fas fa-phone-alt"></i> تواصل معنا</a>
    </div>
</nav>

<div class="container">
    <div class="tool-card">
        <h2><i class="fas fa-robot" style="color: var(--gold);"></i> أداة التحليل وتوليد المحتوى</h2>
        
        <div class="form-group">
            <label><i class="fas fa-user-tie"></i> الاسم الكريم</label>
            <input type="text" id="userName" placeholder="أدخل اسمك" value="">
        </div>

        <div class="form-group">
            <label><i class="fas fa-cogs"></i> نوع الخدمة</label>
            <select id="toolService">
                <option value="reportAnalysis">📊 تحليل تقرير (مالي، فني، تسويقي)</option>
                <option value="weeklyContent">📅 خطة محتوى أسبوعية</option>
                <option value="monthlyContent">🗓️ خطة محتوى شهرية</option>
                <option value="viralIdeas">🔥 أفكار فيروسية</option>
                <option value="buildContent">🏗️ بناء محتوى كامل (مقدمة، أقسام، خاتمة)</option>
                <option value="digitalProducts">💡 أفكار منتجات رقمية</option>
                <option value="askQuestion">❓ الإجابة على سؤال محدد</option>
                <option value="videoScript">📹 نص فيديو سوشال ميديا (هوك + محتوى + CTA)</option>
            </select>
        </div>

        <div class="form-group" id="countRow" style="display: none;">
            <label><i class="fas fa-hashtag"></i> العدد المطلوب</label>
            <input type="number" id="itemCount" min="1" max="30" value="7">
        </div>

        <div class="form-group">
            <label><i class="fas fa-file-alt"></i> نص التقرير أو تفاصيل المطلوب</label>
            <textarea id="userPrompt" placeholder="ألصق هنا التقرير المراد تحليله، أو اكتب تفاصيل الفكرة..."></textarea>
        </div>

        <button class="btn-main" id="generateBtn">
            <i class="fas fa-magic"></i> ابدأ التحليل / التوليد
        </button>

        <div id="outputSection">
            <div class="action-bar">
                <button class="btn-export bg-pdf" id="exportPdfBtn"><i class="fas fa-file-pdf"></i> حفظ PDF</button>
                <button class="btn-export bg-word" id="exportWordBtn"><i class="fas fa-file-word"></i> حفظ Word</button>
            </div>
            <div id="aiOutput" class="result-container"></div>
        </div>
    </div>
</div>

<!-- الفوتر الجديد -->
<footer>
    <div class="footer-container">
        <div class="footer-content">
            <div class="footer-row">
                <div class="footer-social">
                    <a href="https://www.instagram.com/faroukazem/" target="_blank"><i class="fab fa-instagram"></i></a>
                    <a href="https://www.facebook.com/profile.php?id=100091571594026&sk=about" target="_blank"><i class="fab fa-facebook-f"></i></a>
                    <a href="https://wa.me/905550196682" target="_blank"><i class="fab fa-whatsapp"></i></a>
                </div>

                <div class="footer-logo-box">
                    <h2>مجموعة فاروق للاستشارات والأعمال</h2>
                    <div></div>
                </div>

                <div class="footer-payment">
                    <div class="payment-card">
                        <img src="https://img.icons8.com/color/48/visa.png" alt="Visa">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" alt="Mastercard">
                    </div>
                </div>
            </div>

            <hr>

            <div class="copyright">
                جميع الحقوق محفوظة © 2026 <span>FAROUK GRUP</span>
                <p>Adnan Kahveci, Beylikdüzü / İstanbul, Türkiye</p>
            </div>
        </div>
    </div>
</footer>

<!-- JavaScript (كما هو من الكود العامل) -->
<script>
    // إظهار/إخفاء حقل العدد حسب الخدمة
    document.getElementById('toolService').addEventListener('change', function() {
        const service = this.value;
        const countRow = document.getElementById('countRow');
        const needsCount = ['weeklyContent', 'viralIdeas', 'digitalProducts', 'videoScript'];
        countRow.style.display = needsCount.includes(service) ? 'block' : 'none';
    });

    document.getElementById('generateBtn').addEventListener('click', async () => {
        const name = document.getElementById('userName').value.trim();
        const service = document.getElementById('toolService').value;
        const prompt = document.getElementById('userPrompt').value.trim();
        const count = document.getElementById('itemCount')?.value || 7;
        const outputDiv = document.getElementById('aiOutput');
        const outputSection = document.getElementById('outputSection');

        if (!prompt) {
            alert("يرجى إدخال نص للتحليل أولاً");
            return;
        }

        outputSection.style.display = 'block';
        outputDiv.innerHTML = '<div class="loading"><i class="fas fa-circle-notch fa-spin"></i> جاري المعالجة... يرجى الانتظار</div>';

        // بناء التعليمات حسب الخدمة
        let instruction = "";
        if (service === 'reportAnalysis') {
            instruction = `أنت خبير استشاري أعمال متخصص. قم بتحليل التقرير التالي للأستاذ ${name}. قسم التحليل إلى: ملخص تنفيذي، تحليل الأرقام، نقاط القوة، نقاط الضعف، وتوصيات عملية. استخدم عناوين واضحة تبدأ بـ ###.`;
        } else if (service === 'weeklyContent') {
            instruction = `أنت صانع محتوى محترف. قم بإنشاء خطة محتوى أسبوعية متكاملة لـ ${count} أيام. ابدأ كل يوم بعنوان "اليوم الأول:"، "اليوم الثاني:"، وهكذا. قدم أفكاراً محددة وقابلة للتنفيذ.`;
        } else if (service === 'monthlyContent') {
            instruction = `أنت صانع محتوى محترف. قم بإنشاء خطة محتوى شهرية، مقسمة إلى 4 أسابيع. لكل أسبوع اكتب عنوان رئيسي وأفكار فرعية.`;
        } else if (service === 'viralIdeas') {
            instruction = `أنت خبير تسويق. اقترح ${count} أفكار فيروسية مبتكرة لزيادة التفاعل. اكتب كل فكرة في فقرة منفصلة مع عنوان جذاب.`;
        } else if (service === 'buildContent') {
            instruction = `أنت كاتب محتوى محترف. بناءً على التفاصيل المقدمة، قم ببناء محتوى كامل متكامل (مقدمة، 3 أقسام رئيسية، خاتمة). استخدم عناوين واضحة تبدأ بـ ###.`;
        } else if (service === 'digitalProducts') {
            instruction = `أنت خبير منتجات رقمية. اقترح ${count} أفكار منتجات رقمية مع وصف مختصر وفوائد كل منتج.`;
        } else if (service === 'askQuestion') {
            instruction = `أجب على السؤال التالي بطريقة مفصلة واحترافية، مع تقسيم الإجابة إلى أقسام إذا لزم الأمر.`;
        } else if (service === 'videoScript') {
            instruction = `اكتب ${count} نصوص قصيرة للسوشال ميديا، كل نص يتكون من: هوك قوي، محتوى رئيسي، دعوة لاتخاذ إجراء (CTA). استخدم تنسيقاً واضحاً.`;
        }

        const fullPrompt = `${instruction}\n\nالتفاصيل:\n${prompt}\n\nاللغة: العربية الفصحى.\nهام: لا تكتب أي كود برمجي أو تفكير داخلي. أعطني النص النهائي فقط مع عناوين تبدأ بـ ###.`;

        try {
            const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(fullPrompt)}`);
            let result = await response.text();

            // تنظيف النص من وسوم التفكير إن وجدت
            result = result.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();

            // محاولة استخراج النص من JSON إذا كان الرد JSON
            try {
                const json = JSON.parse(result);
                if (json.choices && json.choices[0] && json.choices[0].message) {
                    result = json.choices[0].message.content;
                } else if (json.content) {
                    result = json.content;
                }
            } catch (e) { /* ليس JSON */ }

            // عرض المحتوى
            displayContent(result);

        } catch (error) {
            outputDiv.innerHTML = '<p style="color:red">عذراً، حدث خطأ في الاتصال. يرجى المحاولة مرة أخرى.</p>';
        }
    });

    // دالة عرض المحتوى بشكل مرتب (تقسيم حسب ###)
    function displayContent(text) {
        const outputDiv = document.getElementById('aiOutput');
        outputDiv.innerHTML = '';

        // تنظيف أولي
        text = text.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();

        // إذا كان النص يحتوي على عناوين ###، نقسم
        const sections = text.split(/###/);
        
        if (sections.length > 1) {
            sections.forEach(sec => {
                if (sec.trim().length < 5) return;
                const lines = sec.trim().split('\n');
                const title = lines[0].replace(/[:\-*]/g, '').trim();
                const body = lines.slice(1).join('\n').trim();
                const card = document.createElement('div');
                card.className = 'content-card';
                if (title && body) {
                    card.innerHTML = `<h3>${title}</h3><p>${body.replace(/\n/g, '<br>')}</p>`;
                } else {
                    card.innerHTML = `<p>${sec.replace(/\n/g, '<br>')}</p>`;
                }
                outputDiv.appendChild(card);
            });
        } else {
            // لا يوجد عناوين، نعرض النص كاملاً في بطاقة واحدة
            const card = document.createElement('div');
            card.className = 'content-card';
            card.innerHTML = `<p>${text.replace(/\n/g, '<br>')}</p>`;
            outputDiv.appendChild(card);
        }
    }

    // تصدير PDF
    document.getElementById('exportPdfBtn').addEventListener('click', function() {
        const element = document.getElementById('aiOutput');
        if (!element.children.length) {
            alert('لا يوجد محتوى للتصدير');
            return;
        }
        html2pdf().from(element).set({
            margin: 1,
            filename: 'منصة التحليل الذكي.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
        }).save();
    });

    // تصدير Word
    document.getElementById('exportWordBtn').addEventListener('click', function() {
        const content = document.getElementById('aiOutput').innerText;
        if (!content) {
            alert('لا يوجد محتوى للتصدير');
            return;
        }
        const blob = new Blob(['\uFEFF' + content], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'منصة التحليل الذكي.doc';
        link.click();
        URL.revokeObjectURL(url);
    });
</script>
