<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>User Guide – Comprehensive Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/pages/guideen.css">
</head>
<body>
    <div class="container">
        <!-- Back button -->
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>

        <!-- Header -->
        <header>
            <h1><i class="fas fa-book-open"></i> Comprehensive User Guide</h1>
            <p>Search for any tool or browse the list below</p>
        </header>

        <!-- Search -->
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search tool name ..." autofocus>
        </div>

        <!-- No results message -->
        <div id="noResults" class="no-results">
            <i class="fas fa-exclamation-circle"></i> No matching tools found
        </div>

        <!-- Tools list -->
        <div class="tools-grid" id="toolsContainer"></div>

        <!-- Footer -->
        <footer>© 2026 <span>FAROUK GRUP</span> · All rights reserved</footer>
    </div>

    <script src="js/pages/guideen.js" defer></script>
</body>
</html>
