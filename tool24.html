<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Tool - FAROUK GRUP</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background:#0b0e17; color:#fff; padding:20px; }
        .box { max-width: 800px; margin:auto; background:#1a2338; padding:25px; border-radius:16px; border:2px solid #b48554; }
        textarea { width:100%; height:180px; padding:15px; background:#0f1625; color:white; border:1px solid #b48554; border-radius:12px; }
        button { padding:14px 28px; background:#b48554; color:white; border:none; border-radius:50px; font-size:16px; cursor:pointer; }
        #output { margin-top:20px; padding:20px; background:#0f1625; border-radius:12px; min-height:100px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🧠 أداة الذكاء الاصطناعي</h2>
        <textarea id="prompt" placeholder="اكتب أو الصق النص هنا..."></textarea>
        <br>
        <button onclick="runTest()">▶️ توليد التحليل</button>
        <button onclick="document.getElementById('output').innerHTML='';">مسح</button>
        
        <div id="output"></div>
    </div>

    <script>
        const WORKER_URL = "https://falling-sound-3ffcgemini-proxyjs.faroukgrup.workers.dev/";

        async function runTest() {
            const prompt = document.getElementById('prompt').value.trim();
            const output = document.getElementById('output');

            if (!prompt) {
                output.innerHTML = "<span style='color:red'>❌ يرجى كتابة نص</span>";
                return;
            }

            output.innerHTML = "⏳ جاري الاتصال...";

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: prompt })
                });

                console.log("Status:", response.status);

                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                const data = await response.json();
                const text = data.choices?.[0]?.message?.content || "تم الاتصال لكن لم يتم استخراج النص";

                output.innerHTML = `<strong>✅ نجح الاتصال</strong><hr>${text.replace(/\n/g, '<br>')}`;
            } catch (err) {
                console.error(err);
                output.innerHTML = `<strong style="color:red">❌ فشل في الاتصال</strong><br><small>${err.message}</small>`;
            }
        }
    </script>
</body>
</html>
