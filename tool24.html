<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>أداة الذكاء الاصطناعي | FAROUK GRUP</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Tajawal', sans-serif;
            background: #0b0e17;
            color: #f0f4fa;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(18,24,36,0.9);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #b48554;
        }
        textarea, select, input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
            border: 2px solid #b48554;
            background: #1a2338;
            color: white;
        }
        button {
            padding: 15px 30px;
            background: #b48554;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            margin: 10px 0;
        }
        #output {
            margin-top: 20px;
            padding: 20px;
            background: #1a2338;
            border-radius: 15px;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        .loading { color: #cfa776; }
    </style>
</head>
<body>
    <div class="container">
        <h2><i class="fas fa-robot"></i> أداة التحليل الذكي</h2>
        
        <textarea id="userPrompt" rows="8" placeholder="ألصق التقرير أو اكتب ما تريد تحليله هنا..."></textarea>
        
        <button onclick="generate()"><i class="fas fa-magic"></i> توليد التحليل</button>
        <button onclick="clearAll()" style="background:#555;">مسح</button>

        <div id="output"></div>
    </div>

    <script>
        const WORKER_URL = "https://falling-sound-3ffcgemini-proxyjs.faroukgrup.workers.dev/";

        async function generate() {
            const prompt = document.getElementById('userPrompt').value.trim();
            const output = document.getElementById('output');

            if (!prompt) {
                output.innerHTML = "<p style='color:red'>يرجى إدخال نص أولاً</p>";
                return;
            }

            output.innerHTML = "<p class='loading'>جاري الاتصال بالذكاء الاصطناعي...</p>";

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ prompt: prompt })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                const text = data.choices?.[0]?.message?.content || 
                            data.candidates?.[0]?.content?.parts?.[0]?.text || 
                            "لم يتم استلام رد صحيح";

                output.innerHTML = `<strong>النتيجة:</strong><br><br>${text.replace(/\n/g, '<br>')}`;
            } catch (err) {
                console.error(err);
                output.innerHTML = `<p style="color:red">❌ فشل في الاتصال<br>${err.message}</p>`;
            }
        }

        function clearAll() {
            document.getElementById('userPrompt').value = '';
            document.getElementById('output').innerHTML = '';
        }
    </script>
</body>
</html>
