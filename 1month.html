<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تفعيل الاشتراك الشهري - مجموعة فاروق</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: #0b0e17; color: white;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px;
        }
        .reg-card {
            background: rgba(18, 24, 36, 0.9);
            padding: 40px; border-radius: 20px;
            border: 1px solid rgba(255,215,0,0.3);
            width: 100%; max-width: 450px; text-align: center;
        }
        input {
            width: 100%; padding: 12px; margin: 10px 0;
            background: rgba(255,255,255,0.05); border: 1px solid #333;
            color: white; border-radius: 8px; font-family: inherit; box-sizing: border-box;
        }
        input[readonly] { background: rgba(255,255,255,0.02); color: #aaa; cursor: not-allowed; }
        button {
            width: 100%; padding: 15px; margin-top: 20px;
            background: linear-gradient(135deg, #d4af37, #aa8a2e);
            border: none; border-radius: 8px; color: #000; font-weight: bold; cursor: pointer; font-family: inherit;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg-box {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .success { background: rgba(75,181,67,0.2); color: #4bb543; border: 1px solid #4bb543; }
        .error { background: rgba(255,68,68,0.2); color: #ff4444; border: 1px solid #ff4444; }
        .exists { background: rgba(255,165,0,0.2); color: #ffa500; border: 1px solid #ffa500; }
        .login-link {
            display: inline-block; margin-top: 10px; color: #d4af37; text-decoration: none;
            border: 1px solid #d4af37; padding: 6px 18px; border-radius: 30px; font-size: 0.9rem;
        }
        .domain-hint {
            font-size: 0.75rem; color: #aaa; margin-top: 2px; text-align: right;
        }
    </style>
</head>
<body>

<div class="reg-card">
    <i class="fas fa-user-plus" style="font-size: 3rem; color: #d4af37; margin-bottom: 20px;"></i>
    <h2>تفعيل حساب المشترك الشهري</h2>
    <p>اشتراك لمدة شهر واحد مع جميع الميزات</p>

    <form id="monthlyForm">
        <input type="text" name="fullName" placeholder="الاسم الكامل (اختياري)">
        <input type="email" name="username" placeholder="البريد الإلكتروني (Gmail, Yahoo...)" required inputmode="email">
        <div class="domain-hint">نطاقات حقيقية فقط (مثل gmail.com, outlook.com)</div>
        <input type="password" name="password" placeholder="كلمة المرور للدخول" required minlength="6">
        <label style="display:block; text-align:right; font-size: 0.8rem; margin-top: 10px; color: #d4af37;">تاريخ انتهاء الاشتراك (تلقائي):</label>
        <input type="text" id="expiryDisplay" readonly>
        <button type="submit" id="monthlyBtn">تفعيل الاشتراك الشهري</button>
    </form>

    <div id="msgBox" class="msg-box"></div>
</div>

<script>
    // عرض تاريخ بعد شهر للتوضيح
    const nextMonth = new Date();
    nextMonth.setMonth(nextMonth.getMonth() + 1);
    document.getElementById('expiryDisplay').value = nextMonth.toISOString().split('T')[0];

    // رابط السكريبت الرئيسي المطوَّر (نفسه لجميع العمليات)
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzEKTIjGkqFYe183KqU_oJlKQgYtylaR5m-coI3IjAesafRQpacGpDqWABC5gJWoVxj/exec';

    const form = document.getElementById('monthlyForm');
    const btn = document.getElementById('monthlyBtn');
    const msgBox = document.getElementById('msgBox');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        msgBox.style.display = 'none';
        msgBox.className = 'msg-box';
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> جاري التفعيل...';

        const formData = new FormData(this);
        formData.append('action', 'monthRegister');   // الإجراء الجديد للشهر

        fetch(scriptURL, {
            method: 'POST',
            body: formData,
            mode: 'cors'
        })
        .then(response => response.json())
        .then(data => {
            msgBox.style.display = 'block';

            if (data.status === 'success') {
                msgBox.className = 'msg-box success';
                msgBox.innerHTML = `
                    <i class="fas fa-check-circle"></i> ${data.message}<br>
                    <a href="${data.loginUrl}" class="login-link">اذهب إلى صفحة الدخول</a>
                `;
                form.reset();
            } 
            else if (data.status === 'exists') {
                msgBox.className = 'msg-box exists';
                msgBox.innerHTML = `
                    <i class="fas fa-exclamation-triangle"></i> ${data.message}
                `;
            } 
            else {
                msgBox.className = 'msg-box error';
                msgBox.textContent = '❌ ' + (data.message || 'حدث خطأ غير معروف');
            }
        })
        .catch(error => {
            msgBox.style.display = 'block';
            msgBox.className = 'msg-box error';
            msgBox.textContent = '❌ تعذر الاتصال بالسيرفر. تأكد من اتصالك بالإنترنت.';
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerHTML = 'تفعيل الاشتراك الشهري';
        });
    });
</script>

</body>
</html>
