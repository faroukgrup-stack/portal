<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>أداة توليد المحتوى الذكي | FAROUK GRUP</title>
    <!-- حماية الصفحة -->
    <script src="../js/auth-check.js"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link rel="stylesheet" <link rel="stylesheet" href="../css/tools-common.css">
    <link rel="stylesheet" href="../css/tools/tool24.css">
    <link rel="stylesheet" href="../css/tools-overrides.css">>
</head>
<body>
    <!-- خلفية ثابتة -->
    <div class="glow-bg"><span></span><span></span><span></span></div>

    <!-- شاشة تحميل التصدير -->
    <div class="export-loading" id="exportLoading">
        <div class="export-loading-box">
            <i class="fas fa-spinner"></i>
            <h3 id="loadingTitle">جاري إنشاء التقرير...</h3>
            <p id="loadingMsg">يرجى الانتظار</p>
        </div>
    </div>

    <!-- HERO -->
    <section class="hero-mini">
    
        <h2>🤖 أداة التحليل وتوليد المحتوى</h2>
        <p>أنشئ محتوى احترافي، حلل تقاريرك، واستلهم أفكاراً مبتكرة بلمسة زر واحدة</p>
    </section>

    <!-- WRAPPER -->
    <section class="calc-wrapper">
        <div class="calc-box">
            <div class="featured-badge"><i class="fas fa-magic"></i><span>ذكي</span></div>
            <h2><i class="fas fa-magic" style="color:#cfa776;margin-left:0.5rem;"></i>إعدادات التوليد</h2>

            <!-- اختيار الخدمة -->
            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-cogs"></i> نوع الخدمة</label>
                    <select id="toolService">
                        <option value="reportAnalysis">📊 تحليل تقرير</option>
                        <option value="weeklyContent">📅 خطة أسبوعية</option>
                        <option value="buildContent">🏗️ بناء محتوى كامل</option>
                        <option value="askQuestion">❓ الإجابة على سؤال</option>
                    </select>
                </div>
                <div class="form-group" id="countRow" style="display:none;">
                    <label><i class="fas fa-hashtag"></i> العدد</label>
                    <input type="number" id="itemCount" min="1" max="30" value="7">
                </div>
            </div>

            <!-- نص المستخدم -->
            <div class="form-group">
                <label><i class="fas fa-file-alt"></i> نص التقرير أو تفاصيل المطلوب</label>
                <textarea id="userPrompt" placeholder="ألصق هنا النص..."></textarea>
            </div>

            <!-- الأزرار -->
            <button class="btn-calculate" id="generateBtn"><i class="fas fa-magic"></i> ابدأ التحليل / التوليد</button>
            <button class="btn-calculate btn-cancel" id="cancelBtn"><i class="fas fa-times-circle"></i> إلغاء الطلب</button>

            <!-- منطقة النتائج -->
            <div class="results-section" id="resultsSection" style="display: none;">
                <div class="results-cards" id="kpiCards"></div>
                <div class="section-title-sm">📄 المحتوى المُنشأ</div>
                <div id="aiOutput"></div>
                <div class="export-container">
                    <button class="export-word-btn" id="exportWordBtn"><i class="fas fa-file-word"></i> تصدير إلى Word</button>
                </div>
            </div>

            <div id="initialMessage" style="margin-top:1rem; color:#aab7d4; text-align:center;">
                <i class="fas fa-robot" style="color:#cfa776;"></i> سيتم عرض النتائج بعد الضغط على زر التوليد
            </div>
        </div>
    </section>

    <footer class="footer-simple">
        جميع الحقوق محفوظة © 2026 <span>FAROUK GRUP</span>
    </footer>

    <!-- زر الرئيسية العائم -->
    <a href="../index.html" class="home-floating-btn"><i class="fas fa-home"></i> الرئيسية</a>

    <script src="../js/tools/tool24.js" defer></script>
</body>
</html>
