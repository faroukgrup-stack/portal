<!DOCTYPE html>

<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" name="viewport"/>
<title data-i18n="h1">الحاسبة المالية والاستشارية | FAROUK GRUP</title>
<!-- FAROUK GRUP v7 — Supabase: اللغة/التصميم/الحماية/الترجمة تُدار من fg-boot.js -->
<meta content="tool16" name="fg-tool"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/fg-config.js"></script>
<script src="../js/fg-boot.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

&gt;
</head>
<body>
<!-- خلفية ثابتة -->
<div class="glow-bg"><span></span><span></span><span></span></div>
<!-- شاشة تحميل التصدير -->
<div class="export-loading" id="exportLoading">
<div class="export-loading-box">
<i class="fas fa-spinner"></i>
<h3 data-i18n="h2" id="loadingTitle">جاري إنشاء التقرير...</h3>
<p data-i18n="h3" id="loadingMsg">يرجى الانتظار</p>
</div>
</div>
<!-- HERO -->
<section class="hero-mini">
<h2 data-i18n="h4">🧮 الحاسبة المالية والاستشارية</h2>
<p data-i18n="h5">عمليات حسابية متقدمة، دوال مالية، وسجل شامل لكل العمليات</p>
</section>
<!-- الهيدر -->
<div class="header-bar">
<div class="datetime">
<div><i class="fas fa-calendar-alt"></i> <span id="currentDate"></span></div>
<div><i class="fas fa-clock"></i> <span id="currentTime"></span></div>
</div>
<div class="header-title"><i class="fas fa-calculator"></i> <fg-t data-i18n="h6">مجموعة فاروق للاستشارات والأعمال</fg-t></div>
</div>
<!-- المحتوى الرئيسي -->
<div class="main-content">
<div class="calc-container">
<!-- الآلة الحاسبة -->
<div class="calculator">
<div class="calculator-header">
<h2><i class="fas fa-calculator"></i> <fg-t data-i18n="h7">الحاسبة الاستشارية</fg-t></h2>
</div>
<div class="error-message" id="errorMessage"></div>
<div class="screen-container">
<div class="history-display" id="historyDisplay"></div>
<div class="main-display" id="display">0</div>
</div>
<div class="buttons-grid">
<button class="btn btn-memory" onclick="handleMemory('MC')">MC</button>
<button class="btn btn-memory" onclick="handleMemory('MR')">MR</button>
<button class="btn btn-memory" onclick="handleMemory('M+')">M+</button>
<button class="btn btn-memory" onclick="handleMemory('M-')">M-</button>
<button class="btn btn-action" onclick="clearEntry()">CE</button>
<button class="btn btn-number" onclick="appendToDisplay('9')">9</button>
<button class="btn btn-number" onclick="appendToDisplay('8')">8</button>
<button class="btn btn-number" onclick="appendToDisplay('7')">7</button>
<button class="btn btn-operator" onclick="setOperator('/')">÷</button>
<button class="btn btn-action" onclick="clearDisplay()">C</button>
<button class="btn btn-number" onclick="appendToDisplay('6')">6</button>
<button class="btn btn-number" onclick="appendToDisplay('5')">5</button>
<button class="btn btn-number" onclick="appendToDisplay('4')">4</button>
<button class="btn btn-operator" onclick="setOperator('*')">×</button>
<button class="btn" onclick="backspace()"><i class="fas fa-backspace"></i></button>
<button class="btn btn-number" onclick="appendToDisplay('3')">3</button>
<button class="btn btn-number" onclick="appendToDisplay('2')">2</button>
<button class="btn btn-number" onclick="appendToDisplay('1')">1</button>
<button class="btn btn-operator" onclick="setOperator('-')">-</button>
<button class="btn" onclick="calculateSquareRoot()">√</button>
<button class="btn" onclick="toggleSign()">±</button>
<button class="btn btn-number" onclick="appendToDisplay('.')">.</button>
<button class="btn btn-number" onclick="appendToDisplay('0')">0</button>
<button class="btn btn-operator" onclick="setOperator('+')">+</button>
<button class="btn" onclick="calculatePercent()">%</button>
<button class="btn btn-finance" data-i18n="h8" onclick="applyTax()">ضريبة</button>
<button class="btn btn-finance" data-i18n="h9" onclick="applyDiscount()">خصم</button>
<button class="btn btn-finance" onclick="calculateROI()">ROI</button>
<button class="btn btn-finance" data-i18n="h10" onclick="calculateSimpleInterest()">فائدة</button>
<button class="btn" onclick="power()">xʸ</button>
<button class="btn btn-equals" onclick="calculateResult()">=</button>
<button class="btn" onclick="calculateReciprocal()">1/x</button>
<button class="btn" onclick="log10()">log</button>
<button class="btn" onclick="factorial()">n!</button>
</div>
</div>
<!-- لوحة السجل -->
<div class="history-panel">
<div class="history-header">
<h3><i class="fas fa-table"></i> <fg-t data-i18n="h11">سجل العمليات</fg-t></h3>
<div class="history-controls">
<select class="filter-select" id="filterSelect" onchange="filterHistory()">
<option data-i18n="h12" value="all">كل العمليات</option>
<option data-i18n="h13" value="+">جمع (+)</option>
<option data-i18n="h14" value="-">طرح (-)</option>
<option data-i18n="h15" value="*">ضرب (×)</option>
<option data-i18n="h16" value="/">قسمة (÷)</option>
<option data-i18n="h17" value="مالية">عمليات مالية / متقدمة</option>
</select>
<button class="btn-export" onclick="exportHistory()"><i class="fas fa-download"></i> CSV</button>
</div>
</div>
<div class="table-container">
<table class="history-table">
<thead>
<tr><th data-i18n="h18" style="width:12%;">النوع</th><th data-i18n="h19" style="width:43%;">العملية</th><th data-i18n="h20" style="width:25%;">النتيجة</th><th data-i18n="h21" style="width:20%;text-align:center;">إجراء</th></tr>
</thead>
<tbody id="historyTableBody"></tbody>
</table>
</div>
<button class="btn-clear-all" onclick="clearHistory()"><i class="fas fa-trash-alt"></i> <fg-t data-i18n="h22">مسح كامل السجل</fg-t></button>
<div class="export-bar">
<button class="btn-export-excel" id="exportExcelBtn"><i class="fas fa-file-excel"></i> <fg-t data-i18n="h23">Excel شامل</fg-t></button>
<button class="btn-export-word" id="exportWordBtn"><i class="fas fa-file-word"></i> Word</button>
</div>
</div>
</div>
</div>
<!-- فوتر -->
<footer class="footer-simple">
    <fg-t data-i18n="h24">جميع الحقوق محفوظة © 2026</fg-t> <span>FAROUK GRUP</span>
</footer>
<!-- أزرار عائمة -->
<a class="home-floating-btn" href="../index.html"><i class="fas fa-home"></i> <fg-t data-i18n="h25">الرئيسية</fg-t></a>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

</body>
</html>
