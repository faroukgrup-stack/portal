<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Financial & Consulting Calculator | FAROUK GRUP</title>
<!-- Page protection -->
<script src="../js/auth-check.js"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- html2canvas for Word export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- ExcelJS & FileSaver -->
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link rel="stylesheet" href="../css/tools-common-en.css">
    <link rel="stylesheet" href="../css/tools-common-en.css">
    <link rel="stylesheet" href="../css/tools/tool16en.css">
    <link rel="stylesheet" href="../css/tools-overrides-en.css">
    <link rel="stylesheet" href="../css/tools-overrides-en.css">
</head>
<body>
<!-- Fixed background -->
<div class="glow-bg"><span></span><span></span><span></span></div>

<!-- Export loading screen -->
<div class="export-loading" id="exportLoading">
    <div class="export-loading-box">
        <i class="fas fa-spinner"></i>
        <h3 id="loadingTitle">Generating report...</h3>
        <p id="loadingMsg">Please wait</p>
    </div>
</div>

<!-- HERO -->
<section class="hero-mini">
    <h2>🧮 Financial & Consulting Calculator</h2>
    <p>Advanced arithmetic, financial functions, and a comprehensive operation log</p>
</section>

<!-- HEADER -->
<div class="header-bar">
    <div class="datetime">
        <div><i class="fas fa-calendar-alt"></i> <span id="currentDate"></span></div>
        <div><i class="fas fa-clock"></i> <span id="currentTime"></span></div>
    </div>
    <div class="header-title"><i class="fas fa-calculator"></i> FAROUK GRUP for Consulting & Business</div>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">
    <div class="calc-container">
        <!-- CALCULATOR -->
        <div class="calculator">
            <div class="calculator-header">
                <h2><i class="fas fa-calculator"></i> Consulting Calculator</h2>
            </div>
            <div class="error-message" id="errorMessage"></div>
            <div class="screen-container">
                <div class="history-display" id="historyDisplay"></div>
                <div class="main-display" id="display">0</div>
            </div>
            <div class="buttons-grid">
                <!-- Row 1: Memory & clear -->
                <button class="btn btn-memory" onclick="handleMemory('MC')">MC</button>
                <button class="btn btn-memory" onclick="handleMemory('MR')">MR</button>
                <button class="btn btn-memory" onclick="handleMemory('M+')">M+</button>
                <button class="btn btn-memory" onclick="handleMemory('M-')">M-</button>

                <!-- Row 2: 7 8 9 ÷ -->
                <button class="btn btn-number" onclick="appendToDisplay('7')">7</button>
                <button class="btn btn-number" onclick="appendToDisplay('8')">8</button>
                <button class="btn btn-number" onclick="appendToDisplay('9')">9</button>
                <button class="btn btn-operator" onclick="setOperator('/')">÷</button>

                <!-- Row 3: 4 5 6 × -->
                <button class="btn btn-number" onclick="appendToDisplay('4')">4</button>
                <button class="btn btn-number" onclick="appendToDisplay('5')">5</button>
                <button class="btn btn-number" onclick="appendToDisplay('6')">6</button>
                <button class="btn btn-operator" onclick="setOperator('*')">×</button>

                <!-- Row 4: 1 2 3 − -->
                <button class="btn btn-number" onclick="appendToDisplay('1')">1</button>
                <button class="btn btn-number" onclick="appendToDisplay('2')">2</button>
                <button class="btn btn-number" onclick="appendToDisplay('3')">3</button>
                <button class="btn btn-operator" onclick="setOperator('-')">-</button>

                <!-- Row 5: C 0 . + -->
                <button class="btn btn-action" onclick="clearDisplay()">C</button>
                <button class="btn btn-number" onclick="appendToDisplay('0')">0</button>
                <button class="btn btn-number" onclick="appendToDisplay('.')">.</button>
                <button class="btn btn-operator" onclick="setOperator('+')">+</button>

                <!-- Row 6: ⌫ = (span 2) -->
                <button class="btn" onclick="backspace()"><i class="fas fa-backspace"></i></button>
                <button class="btn btn-equals" onclick="calculateResult()">=</button>

                <!-- Additional function buttons (span 2 columns each, placed below) -->
                <button class="btn btn-action" onclick="clearEntry()">CE</button>
                <button class="btn" onclick="calculateSquareRoot()">√</button>
                <button class="btn" onclick="toggleSign()">±</button>
                <button class="btn" onclick="calculatePercent()">%</button>
                <button class="btn btn-finance" onclick="applyTax()">Tax</button>
                <button class="btn btn-finance" onclick="applyDiscount()">Discount</button>
                <button class="btn btn-finance" onclick="calculateROI()">ROI</button>
                <button class="btn btn-finance" onclick="calculateSimpleInterest()">Interest</button>
                <button class="btn" onclick="power()">xʸ</button>
                <button class="btn" onclick="calculateReciprocal()">1/x</button>
                <button class="btn" onclick="log10()">log</button>
                <button class="btn" onclick="factorial()">n!</button>
            </div>
        </div>

        <!-- HISTORY PANEL -->
        <div class="history-panel">
            <div class="history-header">
                <h3><i class="fas fa-table"></i> Operation Log</h3>
                <div class="history-controls">
                    <select id="filterSelect" class="filter-select" onchange="filterHistory()">
                        <option value="all">All operations</option>
                        <option value="+">Addition (+)</option>
                        <option value="-">Subtraction (-)</option>
                        <option value="*">Multiplication (×)</option>
                        <option value="/">Division (÷)</option>
                        <option value="مالية">Financial / Advanced</option>
                    </select>
                    <button class="btn-export" onclick="exportHistory()"><i class="fas fa-download"></i> CSV</button>
                </div>
            </div>
            <div class="table-container">
                <table class="history-table">
                    <thead>
                        <tr><th style="width:12%;">Type</th><th style="width:43%;">Operation</th><th style="width:25%;">Result</th><th style="width:20%;text-align:center;">Action</th></tr>
                    </thead>
                    <tbody id="historyTableBody"></tbody>
                </table>
            </div>
            <button class="btn-clear-all" onclick="clearHistory()"><i class="fas fa-trash-alt"></i> Clear entire history</button>
            <div class="export-bar">
                <button class="btn-export-excel" id="exportExcelBtn"><i class="fas fa-file-excel"></i> Full Excel</button>
                <button class="btn-export-word" id="exportWordBtn"><i class="fas fa-file-word"></i> Word</button>
            </div>
        </div>
    </div>
</div>

<!-- FOOTER -->
<footer class="footer-simple">
    All rights reserved © 2026 <span>FAROUK GRUP</span>
</footer>

<!-- Floating buttons -->
<a href="../index.html" class="home-floating-btn"><i class="fas fa-home"></i> Home</a>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="../js/tools/tool16en.js" defer></script>
</body>
</html>
